<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sa bàn Ngọc Hồi – Đống Đa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#eceff2; --panel:#ffffff; --line:#d3d9df; --fg:#1a2530; --muted:#586573;
  --accent:#b8322a; --accent-soft:#f8e1de; --accent-ink:#ffffff;
  --ok:#1d7a4a; --ok-soft:#dcf1e5; --warn:#9a4f08; --warn-soft:#fbead4;
  --land:#e5c673; --land-2:#d6b55f; --river:#8cc1cf; --river-edge:#5f9db0; --ink:#3a2c12;
  --red-fill:#c7352b; --red-stroke:#7d1c16; --blue-fill:#4a78bd; --blue-stroke:#1d3e72; --blue:#2c5aa0;
  --flag-y:#f4c430; --citadel:#8a6430; --post:#fff7e0;
  --font-d:'Oswald','Arial Narrow',sans-serif; --font-b:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#1a2128; --line:#2b353e; --fg:#e8edf1; --muted:#9aa8b4;
    --accent:#f07a6c; --accent-soft:#3a1f1d; --accent-ink:#1a0d0b;
    --ok:#5cc58f; --ok-soft:#183326; --warn:#f0a04b; --warn-soft:#3a2810;
    --land:#2b3a33; --land-2:#36483f; --river:#2e5f73; --river-edge:#1f4556; --ink:#ebe5d0;
    --red-fill:#e5584a; --red-stroke:#ffd0c9; --blue-fill:#5d8fe0; --blue-stroke:#cfe0ff; --blue:#7aa7ee;
    --flag-y:#f4c430; --citadel:#c9a86a; --post:#232d28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#1a2128; --line:#2b353e; --fg:#e8edf1; --muted:#9aa8b4;
  --accent:#f07a6c; --accent-soft:#3a1f1d; --accent-ink:#1a0d0b;
  --ok:#5cc58f; --ok-soft:#183326; --warn:#f0a04b; --warn-soft:#3a2810;
  --land:#2b3a33; --land-2:#36483f; --river:#2e5f73; --river-edge:#1f4556; --ink:#ebe5d0;
  --red-fill:#e5584a; --red-stroke:#ffd0c9; --blue-fill:#5d8fe0; --blue-stroke:#cfe0ff; --blue:#7aa7ee;
  --flag-y:#f4c430; --citadel:#c9a86a; --post:#232d28; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--font-d);font-weight:700;font-size:clamp(24px,3.4vw,36px);letter-spacing:.04em;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600;margin-right:4px}
.mapcol{min-width:0;display:flex;flex-direction:column;gap:10px}
.player{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip i{font-style:normal;font-family:var(--font-d);font-weight:600;font-size:12px;background:var(--bg);border-radius:4px;min-width:20px;text-align:center;padding:0 4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] i{background:rgba(255,255,255,.25);color:inherit}
.ctrls{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cap-k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cap-t{font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.03em;margin:1px 0 3px;line-height:1.2}
.cap-x{font-size:12.5px;color:var(--fg);margin:0}
.cap-close{position:absolute;top:4px;right:6px;border:0;background:none;font-size:18px;line-height:1;color:var(--muted);padding:2px 6px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.leg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px 4px 7px;font-size:12px}
.leg svg{width:26px;height:18px;flex:none}
.leg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
/* map svg */
@keyframes pulse{50%{stroke-width:9}}
polygon.ar-red,polygon.ar-blue{cursor:pointer}
/* panel */
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:11px 6px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow:auto;padding:14px}
.pane[hidden]{display:none!important}
.pane h3{font-family:var(--font-d);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:15px;margin:0 0 6px}
.pane p{margin:0 0 8px}
.pane ul{margin:0 0 8px;padding-left:18px}
.pane li{margin-bottom:3px}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:12px}
.card.place{border-color:var(--accent);background:var(--accent-soft)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::after{content:"+";color:var(--muted);font-weight:400}
details[open] summary::after{content:"–"}
summary::-webkit-details-marker{display:none}
.tbl{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;width:100%;min-width:340px;font-size:12.5px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600}
.tl{list-style:none;padding:0!important;margin:6px 0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.tl .dt{font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.03em;color:var(--accent)}
.tl .dt small{display:block;font-family:var(--font-b);font-size:11px;color:var(--muted);font-weight:400}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;text-decoration:underline;font-size:12.5px}
.seg{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.seg .chip{font-size:12px}
.fc{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:16px;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.fc .side{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.fc .txt{font-size:15.5px;font-weight:500}
.fc.back{background:var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.muted{color:var(--muted);font-size:12.5px}
.nug{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.nug b{font-family:var(--font-d);letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.mn{background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 12px;font-family:var(--font-d);letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-top:10px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.qq{font-size:15.5px;font-weight:600;margin:6px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;margin-bottom:7px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.fb{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--warn-soft);border:1px solid var(--warn)}
.score{font-family:var(--font-d);font-size:44px;font-weight:700;line-height:1}
.toast-wrong{border-top:1px solid var(--line);padding:8px 0}


/* ===== Bố cục v2: sa bàn dùng ảnh gốc, cuộn nội dung bên trong từng tab ===== */
:root{--frame:#dde2e7;--mapbg:#fcd95b;--spot:#ffffff;--veil:rgba(30,22,6,.42)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--frame:#0d1216}}
:root[data-theme="dark"]{--frame:#0d1216}
html,body{height:100%}
body{margin:0}
@media (min-width:900px){html,body{overflow:hidden}}
h1{font-size:clamp(20px,2.3vw,28px)}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.top{flex:none}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:2fr 1fr;gap:14px}
.mapcol{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.player{flex:none}
.mapbox{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,250px);gap:10px;border:0;background:none;border-radius:0;overflow:visible;position:static}
.mapimg{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--frame);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;scrollbar-width:thin}
.cap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:auto;box-shadow:none}
.cap-x{font-size:13px;line-height:1.55}
.cap-btn{margin-top:8px}
.hl{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px}
.hl-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.legend{display:flex;flex-direction:column;gap:5px}
.leg{width:100%;justify-content:flex-start}
.leg svg{width:30px;height:20px}
.leg[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.leg[aria-pressed="false"]{opacity:1;text-decoration:none}
/* lớp phủ trên ảnh */
.veil{fill:var(--veil);opacity:0;transition:opacity .35s;pointer-events:none}
.spotting .veil{opacity:1}
#spotimg{opacity:0;transition:opacity .35s;pointer-events:none}
.spotting #spotimg{opacity:1}
.fx{pointer-events:none}
.flow{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:.1 5.2;animation:flow 1s linear infinite}
.flow.o{stroke:#101820;stroke-width:3.6;opacity:.45;animation:none;stroke-dasharray:none}
@keyframes flow{to{stroke-dashoffset:-5.3}}
.outline{fill:none;stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
.outline.o{stroke:#101820;stroke-width:2.8;opacity:.5}
.sring{fill:none;stroke:#fff;stroke-width:2}
.sring.o{stroke:#101820;stroke-width:4.4;opacity:.45}
.blurlayer{display:none;pointer-events:none}
.blind .blurlayer{display:inline}
.blind.rv .blurlayer{display:none}
.hit{cursor:pointer}
.hit .ring,.hit .area{fill:transparent;stroke:transparent;stroke-width:2}
.hit:hover .ring{stroke:#101820;stroke-dasharray:3 2}
.hit:hover .area{fill:rgba(255,255,255,.28);stroke:#101820;stroke-width:1.2}
.hit.sel .ring{stroke:#101820;stroke-width:2.6;stroke-dasharray:none}
.hit.sel .area{fill:rgba(255,255,255,.2)}
.hit.right .ring{stroke:var(--ok);stroke-width:3.5;stroke-dasharray:none;fill:rgba(60,200,120,.28);animation:pulse 1s 3}
.hit.wrong .ring{stroke:#d9480f;stroke-width:3.5;stroke-dasharray:none;fill:rgba(217,72,15,.22)}
@keyframes pulse{50%{stroke-width:6}}
.hit:focus-visible{outline:none}
.hit:focus-visible .ring,.hit:focus-visible .area{stroke:#101820;stroke-width:2.6}
/* bảng bên phải: cuộn bên trong từng tab */
.panel{position:relative;min-height:0}
.prog{height:3px;background:var(--line);flex:none}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.pane{overscroll-behavior:contain;scrollbar-width:thin;scrollbar-gutter:stable;scroll-behavior:smooth}
.pane::-webkit-scrollbar,.side::-webkit-scrollbar{width:8px}
.pane::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.totop{position:absolute;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.2);display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .2s,transform .2s;z-index:3}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop:hover{border-color:var(--accent)}
.reader{flex:none;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.rd-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rd-row .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px}
.rd-row svg,.cap-btn svg{width:15px;height:15px;flex:none;fill:currentColor}
.rd-st{font-size:12px;color:var(--muted);display:none;line-height:1.4}
.reader.on .rd-st{display:block}
.rd-st b{color:var(--fg)}
.rd-set{display:none;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.reader.open .rd-set{display:flex}
.rd-set select{max-width:100%;min-width:0;font:inherit;font-size:12px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.rd-set input[type=range]{width:90px;accent-color:var(--accent)}
.rd-note{flex-basis:100%;font-size:11.5px;line-height:1.45}
.btn[hidden]{display:none!important}
@media (max-width:1099px) and (min-width:900px){
  .mapbox{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{flex-direction:row;overflow:auto;max-height:150px}
  .side>*{flex:1 1 220px}
  .legend{flex-direction:row;flex-wrap:wrap}
  .leg{width:auto}
}
@media (max-width:899px){
  body{height:auto}
  .app{height:auto}
  .stage{display:flex;flex-direction:column}
  .mapbox{display:flex;flex-direction:column}
  .mapimg{aspect-ratio:362/468;max-height:78vh;width:100%;margin-inline:auto}
  .side{overflow:visible}
  .legend{flex-direction:row;flex-wrap:wrap}
  .leg{width:auto}
  .panel{height:min(78vh,640px)}
}
@media (prefers-reduced-motion:reduce){.veil,#spotimg,.totop{transition:none}.flow,.hit.right .ring{animation:none}.pane{scroll-behavior:auto}}
/* ===== v3: mũi tên vẽ lại, nhãn vector, sa bàn rộng 3/4 ===== */
:root{--frame:#fcd95b}
.pane table{min-width:0}
.pane th,.pane td{padding:4px 6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--frame:#14110a}}
:root[data-theme="dark"]{--frame:#14110a}
.stage{grid-template-columns:3fr 1fr}
.mapbox{grid-template-columns:minmax(0,1fr) minmax(200px,230px)}
.mapimg{border:0;background:var(--frame);border-radius:10px}
.blurlayer{display:none!important}
.arb{fill:#d62f24;stroke:#7a1410;stroke-width:.9;stroke-linejoin:round}
.arb.blue{fill:#2f62b3;stroke:#1b3f78}
.arbl{fill:none;stroke:#2f62b3;stroke-dasharray:5 3;stroke-linecap:butt}
.ar{opacity:0;pointer-events:none;transition:opacity .35s}
.ar.on{opacity:1;pointer-events:auto}
.ar.on.dim{opacity:.32}
.ar.cur .arb{stroke:#fff;stroke-width:1.1}
.ar .hitline{fill:none;stroke:transparent;stroke-width:16;stroke-linecap:round}
.ar:hover .arb,.ar.sel .arb{filter:brightness(1.12) drop-shadow(0 0 2.5px rgba(255,255,255,.9))}
.ar.on.dim:hover{opacity:.8}
.arlab{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:700;letter-spacing:.06em;paint-order:stroke;stroke-width:1.1px;stroke-linejoin:round;pointer-events:none}
.arlab.r{fill:#fff;stroke:#7a1410}
.arlab.b{fill:#1b3f78;stroke:#fff3b8}
.mpath{transition:none}
.ar.hit .area{display:none}
@media (max-width:899px){.mapbox{display:flex;flex-direction:column}}
@media (prefers-reduced-motion:reduce){.ar{transition:none}}

</style>
<div class="app">
  <header class="top">
    <div>
      <div class="kicker">Lịch sử Việt Nam · Phong trào Tây Sơn</div>
      <h1>Ngọc Hồi – Đống Đa</h1>
    </div>
    <div class="facts">
      <span><b>Mùng 5 Tết Kỷ Dậu</b>30-1-1789</span>
      <span><b>Quang Trung</b>đại phá quân Thanh</span>
      <button class="btn" id="sndBtn" aria-pressed="true" title="Bật hoặc tắt âm thanh sinh động">Âm thanh: bật</button>
    </div>
  </header>
  <main class="stage">
    <section class="mapcol" aria-label="Sa bàn tương tác">
      <div class="player">
        <div class="steps" id="steps" role="group" aria-label="Các bước diễn biến"></div>
        <div class="ctrls">
          <button class="btn" id="prev" aria-label="Bước trước">‹</button>
          <button class="btn primary" id="play">▶ Phát diễn biến</button>
          <button class="btn" id="next" aria-label="Bước sau">›</button>
          <button class="btn" id="blindBtn" aria-pressed="false">Ẩn địa danh</button>
        </div>
      </div>
      <div class="mapbox" id="mapbox">
        <div class="mapimg"><svg id="map" role="img" aria-label="Sa bàn trận Ngọc Hồi – Đống Đa" viewBox="0 0 362 468" preserveAspectRatio="xMidYMid meet"></svg></div>
        <aside class="side">
          <div class="cap" id="cap" aria-live="polite"></div>
          <div class="hl"><div class="hl-t">Làm nổi bật</div><div class="legend" id="legend" role="group" aria-label="Làm nổi bật theo chú giải"></div></div>
        </aside>
      </div>
    </section>
    <aside class="panel">
      <div class="tabs" role="tablist" aria-label="Nội dung học tập">
        <button class="tab" role="tab" id="t-content" aria-selected="true" aria-controls="p-content">Nội dung</button>
        <button class="tab" role="tab" id="t-review" aria-selected="false" aria-controls="p-review">Ôn tập</button>
        <button class="tab" role="tab" id="t-quiz" aria-selected="false" aria-controls="p-quiz">Trắc nghiệm</button>
      </div>
      <div class="prog" aria-hidden="true"><i id="prog"></i></div>

/* ---------- Âm thanh sinh động (WebAudio, không cần tệp ngoài) ---------- */
const sfx=(()=>{
  let ctx=null,master=null,on=true;
  try{on=localStorage.getItem('nhdd-snd')!=='0'}catch(e){}
  const S={quiet:false};
  function ac(){
    if(!on)return null;
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination)}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(f,t,d,type,v,f2){
    const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.0008,t0+d);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.05);
  }
  function noise(t,d,f1,f2,v){
    const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
    const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
    const t0=c.currentTime+t;f.frequency.setValueAtTime(f1,t0);f.frequency.exponentialRampToValueAtTime(f2,t0+d);
    const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+d*.25);g.gain.linearRampToValueAtTime(0,t0+d);
    s.connect(f);f.connect(g);g.connect(master);s.start(t0);
  }
  const drum=(t=0,v=.7)=>{tone(150,t,.28,'sine',v,48);noise(t,.08,900,300,v*.25)};
  S.on=()=>on;
  S.set=v=>{on=v;try{localStorage.setItem('nhdd-snd',v?'1':'0')}catch(e){}if(v){ac();S.tick()}};
  S.tick=()=>{if(S.quiet)return;tone(900,0,.05,'triangle',.16,600)};
  S.flip=()=>{if(S.quiet)return;noise(0,.09,2500,900,.18)};
  S.whoosh=()=>{if(S.quiet)return;noise(0,.55,500,2600,.3)};
  S.step=n=>{
    if(S.quiet)return;
    if(n===0){S.tick();return}
    drum(0,.8);S.whoosh();
    if(n===3){drum(.16,.7);drum(.32,.7)}
    if(n===4){[0,.12,.24,.36].forEach(t=>drum(t+.1,.5))}
    if(n===5)S.gong(.2);
  };
  S.gong=(t=0)=>{[1,2.76,5.4,8.9].forEach((m,i)=>tone(196*m,t,2.2-i*.35,'sine',.28/(i+1)))};
  S.drums=()=>{if(S.quiet)return;[0,.22,.44,.55,.66].forEach((t,i)=>drum(t,i>2?.6:.8))};
  S.ok=()=>{tone(660,0,.25,'sine',.28);tone(990,.11,.4,'sine',.26);tone(1320,.2,.45,'triangle',.12)};
  S.no=()=>{tone(220,0,.32,'sawtooth',.16,120);tone(165,.08,.32,'square',.08,90)};
  S.win=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.5,'triangle',.24));drum(0,.5)};
  S.beat=()=>{if(S.quiet)return;drum(0,.35)};
  return S;
})();

function xmark(g,cx,cy){el('rect',{x:cx-5.5,y:cy-5.5,width:11,height:11,fill:'#f7f7f4',stroke:INK,'stroke-width':.9},g);el('path',{d:`M${cx-5} ${cy-5}L${cx+5} ${cy+5}M${cx+5} ${cy-5}L${cx-5} ${cy+5}`,stroke:INK,'stroke-width':1,fill:'none'},g)}
function bflag(g,x,y,w,h){box(g,x,y,w,h,'#e9ebee','#7d848c');const px=x+w*0.38;el('line',{x1:px,y1:y+3,x2:px,y2:y+h-3,stroke:'#1b3f78','stroke-width':1.1},g);el('path',{d:`M${px} ${y+3.5}L${x+w-4} ${y+h*0.42}L${px} ${y+h*0.6}Z`,fill:'#2c5aa0',stroke:'#1b3f78','stroke-width':.6},g)}

/* ----- trạng thái hiển thị ----- */
function curSpot(){
  if(quizMapActive())return {};
  if(state.sel)return state.sel.startsWith('arr:')?{groups:[state.sel.slice(4)]}:{places:[state.sel]};
  if(state.layer)return LAYER_DEFS.find(l=>l[0]===state.layer)[3];
  return STEP_SPOT[state.step];
}
function arrowState(a,sp){
  if(state.sel||state.layer||quizMapActive()){
    const gs=sp.groups||[];
    if(!gs.length)return{vis:1,hl:0,dim:(sp.places||sp.rings)?1:0};
    const hl=gs.includes(a.g);return{vis:1,hl:hl?1:0,dim:hl?0:1};
  }
  if(state.step===0)return{vis:1,hl:0,dim:0};
  if(a.s>state.step)return{vis:0,hl:0,dim:0};
  if(sp.groups){const h=sp.groups.includes(a.g);return{vis:1,hl:h?1:0,dim:h?0:1}}
  return{vis:1,hl:a.s===state.step?1:0,dim:a.s===state.step?0:1};
}
let lastKey='';
function renderSpot(animate){
  const s=curSpot()||{},pl=s.places||[],rg=s.rings||[];
  const clip=$('#spotclip'),fx=$('#fx');clip.textContent='';fx.textContent='';
  const stepMode=!state.sel&&!state.layer&&!quizMapActive();
  const anyArrowHl=arrows.some(o=>arrowState(o.a,s).hl);
  svg.classList.toggle('spotting',pl.length+rg.length>0||(!stepMode&&(s.groups||[]).length>0)||(stepMode&&state.step>0));
  /* mũi tên */
  let delay=0;
  arrows.forEach(o=>{
    const st=arrowState(o.a,s),g=o.g;
    g.classList.toggle('on',!!st.vis);g.classList.toggle('dim',!!st.dim);g.classList.toggle('cur',!!st.hl);
    const mp=o.mp;
    if(!st.vis){mp.style.transition='none';mp.style.strokeDashoffset=o.L+6;return}
    if(animate&&st.hl&&!reduce){
      mp.style.transition='none';mp.style.strokeDashoffset=o.L+6;mp.getBoundingClientRect();
      mp.style.transition=`stroke-dashoffset ${Math.min(1.4,.5+o.L/180)}s cubic-bezier(.4,0,.2,1) ${delay}s`;mp.style.strokeDashoffset=0;delay+=state.step===5?.18:.35;
    }else{mp.style.transition='none';mp.style.strokeDashoffset=0}
    if(st.hl){
      el('path',{d:o.a.d,class:'flow o'},fx);
      const f=el('path',{d:o.a.d,class:'flow'},fx);
      if(animate&&!reduce)f.style.animationDelay='0s';
    }
  });
  pl.forEach(id=>{
    const [x,y,r]=PXY[id];
    el('circle',{cx:x,cy:y,r:r+3},clip);
    el('circle',{cx:x,cy:y,r:r+3,class:'sring o'},fx);
    const c=el('circle',{cx:x,cy:y,r:r+3,class:'sring'},fx);
    if(!reduce)el('animate',{attributeName:'r',values:`${r+2};${r+6};${r+2}`,dur:'1.4s',repeatCount:'indefinite'},c);
  });
  rg.forEach(([x,y,r])=>{
    el('circle',{cx:x,cy:y,r:r+3},clip);
    el('circle',{cx:x,cy:y,r:r+3,class:'sring o'},fx);
    const c=el('circle',{cx:x,cy:y,r:r+3,class:'sring'},fx);
    if(!reduce)el('animate',{attributeName:'r',values:`${r+2};${r+6};${r+2}`,dur:'1.4s',repeatCount:'indefinite'},c);
  });
}

/* ---------- Tab Trắc nghiệm ---------- */
const Q={active:false,phase:'intro',list:[],i:0,score:0,answered:false,cur:null,wrong:[]};
const quizMapActive=()=>Q.active&&state.tab==='quiz'&&Q.phase==='q'&&Q.cur&&Q.cur.type==='map';
function bestScore(){try{return +localStorage.getItem('nhdd-best')||0}catch(e){return 0}}
function saveBest(v){try{if(v>bestScore())localStorage.setItem('nhdd-best',v)}catch(e){}}
function buildList(pool){
  const mc=shuffle(MCQ).slice(0,7).map(q=>({type:'mc',q:q.q,w:q.w,o:shuffle(q.o.map((t,k)=>({t,ok:k===q.a})))}));
  const mp=shuffle(MAPQ).slice(0,3).map(q=>({type:'map',q:q.q,t:q.t,w:q.w}));
  return shuffle([...mc,...mp]);
}
function startQuiz(list){
  Object.assign(Q,{active:true,phase:'q',list:list||buildList(),i:0,score:0,answered:false,wrong:[]});
  Q.cur=Q.list[0];clearMarks();renderQuiz();updateMapMode();
}
function clearMarks(){$$('#map .hit').forEach(g=>g.classList.remove('right','wrong'))}
function renderQuiz(){
  const p=$('#p-quiz');
  if(Q.phase==='intro'){
    p.innerHTML=`<h3>Trò chơi trắc nghiệm</h3><p>10 câu hỏi: 7 câu chọn đáp án và 3 câu nhấp trực tiếp vào sa bàn (tên địa danh sẽ được ẩn để thử trí nhớ).</p>
    <p class="muted">Điểm cao nhất của bạn trên máy này: <b>${bestScore()}/10</b></p><div class="row"><button class="btn primary" data-act="qstart">Bắt đầu</button></div>`;return;
  }
  if(Q.phase==='result'){
    const n=Q.list.length,pc=Q.score/n,msg=pc>=.9?'Xuất sắc! Bạn nắm vững trận đánh.':pc>=.7?'Khá tốt. Ôn thêm vài chỗ nữa là chắc.':'Cần ôn thêm. Hãy xem lại tab Ôn tập rồi thử lại.';
    p.innerHTML=`<div class="score">${Q.score}<span style="font-size:22px;color:var(--muted)">/${n}</span></div><p style="margin:6px 0 10px"><b>${msg}</b></p>
    ${Q.wrong.length?'<h3>Câu cần xem lại</h3>'+Q.wrong.map(w=>`<div class="toast-wrong"><b>${esc(w.q)}</b><br><span class="muted">${esc(w.w)}</span></div>`).join(''):'<p>Bạn trả lời đúng tất cả các câu.</p>'}
    <div class="row"><button class="btn primary" data-act="qstart">Chơi lại</button>${Q.wrong.length?'<button class="btn" data-act="qwrong">Làm lại câu sai</button>':''}</div>`;return;
  }
  const c=Q.cur,n=Q.list.length;
  let h=`<div class="qh"><span>Câu ${Q.i+1}/${n}</span><span>Điểm ${Q.score}</span></div><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><div class="qq">${esc(c.q)}</div>`;
  if(c.type==='mc'){
    h+=c.o.map((o,k)=>`<button class="opt" data-act="ans" data-k="${k}" ${Q.answered?'disabled':''}><b>${'ABCD'[k]}</b><span>${esc(o.t)}</span></button>`).join('');
  }else if(!Q.answered){
    h+=`<p class="muted">Nhấp vào vị trí trên sa bàn. Địa danh đang được ẩn.</p><div class="row"><button class="btn" data-act="reveal">Xem đáp án</button></div>`;
  }
  if(Q.answered){
    h+=`<div class="fb ${Q.lastOk?'ok':'no'}" role="status"><b>${Q.lastOk?'✓ Chính xác.':'✗ Chưa đúng.'}</b> ${esc(c.w)}</div><div class="row"><button class="btn primary" data-act="qnext">${Q.i+1>=n?'Xem kết quả':'Câu tiếp ›'}</button></div>`;
  }
  p.innerHTML=h;
  if(Q.answered&&c.type==='mc'){$$('#p-quiz .opt').forEach((b,k)=>{if(c.o[k].ok)b.classList.add('correct');else if(k===Q.pickK)b.classList.add('wrong')})}
}
function finishAnswer(ok){
  ok?sfx.ok():sfx.no();
  Q.answered=true;Q.lastOk=ok;if(ok)Q.score++;else Q.wrong.push(Q.cur);
  renderQuiz();updateMapMode();
}
function answerMap(pid){
  const ok=pid===Q.cur.t;
  const tg=svg.querySelector(`.hit[data-pid="${Q.cur.t}"]`);if(tg)tg.classList.add('right');
  if(!ok){const g=svg.querySelector(`.hit[data-pid="${pid}"]`);if(g)g.classList.add('wrong')}
  finishAnswer(ok);
}
function nextQ(){
  clearMarks();
  if(Q.i+1>=Q.list.length){Q.phase='result';Q.active=false;saveBest(Q.score);if(Q.score/Q.list.length>=.7)sfx.win();renderQuiz();updateMapMode();return}
  Q.i++;Q.cur=Q.list[Q.i];Q.answered=false;renderQuiz();updateMapMode();
}

/* ---------- Tab & sự kiện chung ---------- */
function setTab(name){
  state.tab=name;sfx.tick();
  ['content','review','quiz'].forEach(k=>{
    $('#t-'+k).setAttribute('aria-selected',k===name);$('#p-'+k).hidden=k!==name;
  });
  updateMapMode();syncScroll();
  if(name==='quiz'&&quizMapActive()&&matchMedia('(max-width:899px)').matches)$('#mapbox').scrollIntoView({block:'nearest',behavior:'smooth'});
}
$$('.tab').forEach(b=>b.onclick=()=>setTab(b.id.slice(2)));
$('.tabs').addEventListener('keydown',e=>{
  const names=['content','review','quiz'],i=names.indexOf(state.tab);
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const j=(i+(e.key==='ArrowRight'?1:2))%3;setTab(names[j]);$('#t-'+names[j]).focus()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='goto'){stopPlay();setStep(+b.dataset.n);$('#mapbox').scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(a==='pick'){select(b.dataset.p);$('#mapbox').scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(a==='rv'){R.view=b.dataset.v;renderReview()}
  else if(a==='flip'){R.flip=!R.flip;sfx.flip();renderReview()}
  else if(a==='fnext'){R.i=(R.i+1)%FLASH.length;R.flip=false;renderReview()}
  else if(a==='fprev'){R.i=(R.i+FLASH.length-1)%FLASH.length;R.flip=false;renderReview()}
  else if(a==='fshuf'){R.order=shuffle(R.order);R.i=0;R.flip=false;renderReview()}
  else if(a==='known'){const k=R.order[R.i];R.known.has(k)?R.known.delete(k):R.known.add(k);renderReview()}
  else if(a==='qstart'){startQuiz()}
  else if(a==='qwrong'){startQuiz(shuffle(Q.wrong.splice(0)))}
  else if(a==='ans'){if(Q.answered)return;Q.pickK=+b.dataset.k;finishAnswer(Q.cur.o[Q.pickK].ok)}
  else if(a==='reveal'){const tg=svg.querySelector(`.hit[data-pid="${Q.cur.t}"]`);if(tg)tg.classList.add('right');finishAnswer(false)}
  else if(a==='qnext'){nextQ()}
});




/* ---------- Cuộn nội dung trong từng tab ---------- */
function activePane(){return $('#p-'+state.tab)}
function syncScroll(){
  const p=activePane();if(!p)return;
  const max=p.scrollHeight-p.clientHeight;
  $('#prog').style.width=(max>4?Math.min(100,p.scrollTop/max*100):0)+'%';
  $('#toTop').classList.toggle('on',p.scrollTop>180);
}
$$('.pane').forEach(p=>p.addEventListener('scroll',syncScroll,{passive:true}));
$('#toTop').onclick=()=>{activePane().scrollTo({top:0});sfx.tick()};
addEventListener('resize',syncScroll);

/* ---------- Đọc nội dung bằng giọng nói (Web Speech API) ---------- */
const TTS={q:[],i:0,on:false,paused:false,gen:0,voice:null,voices:[],rate:.95,label:''};
const HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
const SOUTH_RE=/nam bộ|miền nam|sài gòn|sai gon|saigon|hồ chí minh|hcm|southern|south/i;
function viText(s){
  return String(s)
    .replace(/(\d{1,2})-(\d{1,2})-(\d{4})/g,'ngày $1 tháng $2 năm $3')
    .replace(/(\d{4})\s*[–-]\s*(\d{4})/g,'$1 đến $2')
    .replace(/(\d+)\s*\/\s*(\d+)/g,'$1 trên $2')
    .replace(/→/g,', rồi ').replace(/[·•]/g,', ').replace(/[✓✗×]/g,' ')
    .replace(/[“”"]/g,'').replace(/\s*[()]\s*/g,', ').replace(/\s*[–—]\s*/g,', ')
    .replace(/\s*\.\.\.|…/g,'.').replace(/\s+/g,' ').replace(/,\s*,/g,',').replace(/,\s*([:.;!?])/g,'$1').replace(/\s+([.,;:!?])/g,'$1').trim();
}
function endP(s){return /[.!?:;]$/.test(s)?s:s+'.'}
function chunk(t,max=170){
  const parts=t.split(/(?<=[.!?;:])\s+/),out=[];let cur='';
  const push=x=>{if(x.trim())out.push(x.trim())};
  parts.forEach(p=>{
    if(p.length>max){push(cur);cur='';let c2='';p.split(/(?<=,)\s+/).forEach(w=>{if((c2+' '+w).length>max){push(c2);c2=w}else c2=(c2?c2+' ':'')+w});push(c2);return}
    if((cur+' '+p).length>max){push(cur);cur=p}else cur=cur?cur+' '+p:p;
  });
  push(cur);return out;
}
function cleanText(n){const c=n.cloneNode(true);c.querySelectorAll('button,#pcard,script').forEach(x=>x.remove());return c.textContent.replace(/\s+/g,' ').trim()}
function domItems(root){
  const out=[];
  (function walk(n){
    if(n.nodeType!==1||n.id==='pcard'||n.tagName==='BUTTON')return;
    const t=n.tagName;
    if(t==='SUMMARY'||t==='H3'||t==='P'){const s=cleanText(n);if(s)out.push(endP(s));return}
    if(t==='TABLE'){
      const rows=[...n.rows],head=[...rows[0].cells].map(c=>c.textContent.trim());
      rows.slice(1).forEach(r=>{const c=[...r.cells].map(x=>x.textContent.trim());out.push(endP(c[0]+': '+c.slice(1).map((v,j)=>head[j+1]+': '+v).join('. ')))});return}
    if(t==='LI'){
      const dt=n.querySelector(':scope>.dt');
      if(dt){const sm=dt.querySelector('small'),d=[...dt.childNodes].filter(x=>x.nodeType===3).map(x=>x.nodeValue).join(' ').trim();
        const body=[...n.children].filter(x=>x!==dt).map(cleanText).join(' ');out.push(endP(d+(sm?', '+sm.textContent.trim():'')+': '+body))}
      else{const s=cleanText(n);if(s)out.push(endP(s))}return}
    if(n.classList.contains('opt')){const b=n.querySelector('b'),sp=n.querySelector('span');out.push(endP('Đáp án '+(b?b.textContent:'')+': '+(sp?sp.textContent:'')));return}
    if(n.classList.contains('nug')){out.push(endP(cleanText(n).replace(/^(\S+(?: \S+)?)\s/,'$1: ')));return}
    if(n.classList.contains('qh')||n.classList.contains('bar'))return;
    if(n.classList.contains('score')){out.push('Điểm của bạn: '+cleanText(n)+'.');return}
    if(n.children.length===0){const s=cleanText(n);if(s)out.push(endP(s));return}
    [...n.children].forEach(walk);
  })(root);
  return out;
}
const sec=(l,arr)=>arr.map(t=>({l,t}));
function itemsMap(){
  const a=[{l:'Sa bàn',t:'Phần sa bàn. Các bước diễn biến.'}];
  STEPS.forEach(s=>a.push({l:'Sa bàn',t:`${s.k}. ${s.x}`}));
  a.push({l:'Sa bàn',t:'Giải thích các địa danh trên sa bàn.'});
  Object.values(PLACES).forEach(p=>a.push({l:'Sa bàn',t:`${p.n}. ${p.tag}. ${p.t}`}));
  Object.values(ARINFO).forEach(p=>a.push({l:'Sa bàn',t:`${p.n}. ${p.tag}. ${p.t}`}));
  return a;
}
function itemsContent(){return [{l:'Nội dung',t:'Tab Nội dung.'},...sec('Nội dung',domItems($('#p-content')))]}
function itemsReview(){
  const a=['Tab Ôn tập. Phần một: thẻ ghi nhớ.'];
  FLASH.forEach((c,i)=>{a.push(`Thẻ ${i+1}. Câu hỏi: ${c.q}`);a.push(`Đáp án: ${c.a}`)});
  a.push('Phần hai: điểm cần nhớ.');NUG.forEach(n=>a.push(`${n[0]}: ${n[1]}`));
  a.push('Mốc nhớ: thần tốc, bất ngờ, nhiều hướng.');
  a.push('Mốc thời gian: ba mươi Tết xuất quân. Mùng ba Tết hạ đồn Hà Hồi. Mùng năm Tết đánh Ngọc Hồi và Đống Đa. Trưa mùng năm vào Thăng Long.');
  a.push('Phần ba: câu hỏi thảo luận.');DISC.forEach((d,i)=>{a.push(`Câu ${i+1}. ${d[0]}`);a.push(`Gợi ý trả lời: ${d[1]}`)});
  return sec('Ôn tập',a);
}
function itemsQuizScreen(){return [{l:'Trắc nghiệm',t:'Tab Trắc nghiệm.'},...sec('Trắc nghiệm',domItems($('#p-quiz')))]}
function itemsQuizBank(){
  const a=['Ngân hàng câu hỏi trắc nghiệm kèm đáp án, dùng để ôn tập.'];
  MCQ.forEach((q,i)=>a.push(`Câu ${i+1}. ${q.q} Các lựa chọn: ${q.o.map((t,k)=>'ABCD'[k]+': '+t).join('; ')}. Đáp án đúng là ${'ABCD'[q.a]}: ${q.o[q.a]}. ${q.w}`));
  a.push('Các câu hỏi nhấp trực tiếp trên sa bàn.');
  MAPQ.forEach((q,i)=>a.push(`Câu sa bàn ${i+1}. ${q.q} Đáp án: ${PLACES[q.t].n}. ${q.w}`));
  return sec('Trắc nghiệm',a);
}
function itemsAll(){
  return [{l:'Mở đầu',t:'Ngọc Hồi, Đống Đa. Trận đánh mùng 5 Tết Kỷ Dậu, ngày 30 tháng 1 năm 1789. Quang Trung đại phá quân Thanh.'},
    ...itemsMap(),...itemsContent(),...itemsReview(),...itemsQuizScreen().slice(0,1),...itemsQuizBank()];
}
function itemsTab(){return state.tab==='content'?itemsContent():state.tab==='review'?itemsReview():itemsQuizScreen()}

/* giọng đọc */
function vscore(v){const n=v.name+' '+v.voiceURI;let s=0;if(SOUTH_RE.test(n))s+=50;if(/natural|neural|online/i.test(n))s+=8;if(/google/i.test(n))s+=4;if(v.localService)s+=1;return s}
function loadVoices(){
  if(!HAS_TTS)return;
  const all=speechSynthesis.getVoices();
  TTS.nAll=all.length;TTS.voices=all.filter(v=>/^vi([-_]|$)/i.test(v.lang)||/vietnam|tiếng việt/i.test(v.name)).sort((a,b)=>vscore(b)-vscore(a));
  const sel=$('#rdVoice');let saved='';try{saved=localStorage.getItem('nhdd-voice')||''}catch(e){}
  sel.innerHTML=TTS.voices.length?TTS.voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)}${SOUTH_RE.test(v.name+' '+v.voiceURI)?' (miền Nam)':''}</option>`).join(''):'<option value="">Giọng mặc định của trình duyệt</option>';
  const pick=TTS.voices.find(v=>v.voiceURI===saved)||TTS.voices[0]||null;
  TTS.voice=pick;if(pick)sel.value=pick.voiceURI;
  const south=TTS.voices.some(v=>SOUTH_RE.test(v.name+' '+v.voiceURI));
  $('#rdNote').textContent=!TTS.voices.length
    ?'Thiết bị này chưa có giọng tiếng Việt nên trang không đọc, để tránh đọc nhầm bằng giọng tiếng Anh. Hãy cài giọng Vietnamese trong cài đặt hệ điều hành (Windows: Language and region, macOS: Accessibility > Spoken Content, Android: Text-to-speech) rồi tải lại trang.'
    :south?'Đã chọn giọng miền Nam có trên thiết bị.'
    :'Trình duyệt chỉ cung cấp giọng tiếng Việt chuẩn, không có giọng riêng miền Nam. Hãy chọn giọng khác trong danh sách nếu thiết bị có nhiều lựa chọn.';
  $('#rdTest').disabled=false;
}
function ui(){
  const r=$('#reader');r.classList.toggle('on',TTS.on);
  $('#rdPause').hidden=!TTS.on;$('#rdStop').hidden=!TTS.on;
  $('#rdPause').textContent=TTS.paused?'Tiếp tục':'Tạm dừng';
  $('#rdTab').disabled=false;
}
function status(){
  if(!TTS.on){$('#rdSt').innerHTML='';return}
  const it=TTS.q[Math.min(TTS.i,TTS.q.length-1)];if(!it)return;
  $('#rdSt').innerHTML=`<b>${TTS.paused?'Đã dừng':'Đang đọc'}: ${esc(it.l)}</b> · câu ${TTS.i+1}/${TTS.q.length} · giọng ${esc(TTS.voice?TTS.voice.name:'mặc định')}<br>${esc(it.t)}`;
}
function prepare(items){
  const q=[];items.forEach(it=>{const t=viText(it.t);if(!t)return;chunk(endP(t)).forEach(c=>q.push({l:it.l,t:c}))});return q;
}
function speakNext(g){
  if(g!==TTS.gen)return;
  if(TTS.i>=TTS.q.length){rdStop(true);return}
  const it=TTS.q[TTS.i],u=new SpeechSynthesisUtterance(it.t);
  u.lang='vi-VN';if(TTS.voice){u.voice=TTS.voice;u.lang=TTS.voice.lang}u.rate=TTS.rate;u.pitch=1;
  u.onend=()=>{if(g!==TTS.gen)return;TTS.i++;speakNext(g)};
  u.onerror=e=>{if(g!==TTS.gen||e.error==='interrupted'||e.error==='canceled')return;TTS.i++;speakNext(g)};
  status();speechSynthesis.speak(u);
}
function rdStart(items){
  if(!HAS_TTS){$('#rdSt').textContent='Trình duyệt này không hỗ trợ đọc bằng giọng nói.';$('#reader').classList.add('on');return}
  if(!TTS.voices.length)loadVoices();
  if(!TTS.voices.length&&TTS.nAll>0){
    $('#reader').classList.add('on','open');$('#rdSt').innerHTML='<b>Chưa có giọng tiếng Việt.</b> Xem hướng dẫn cài giọng ở mục Giọng đọc bên dưới.';return}
  speechSynthesis.cancel();TTS.gen++;stopPlayQuiet();
  TTS.q=prepare(items);TTS.i=0;TTS.on=true;TTS.paused=false;sfx.quiet=true;ui();
  const g=TTS.gen;setTimeout(()=>speakNext(g),90);
}
function stopPlayQuiet(){if(state.timer)stopPlay()}
function rdStop(done){
  TTS.gen++;if(HAS_TTS)speechSynthesis.cancel();TTS.on=false;TTS.paused=false;sfx.quiet=false;ui();
  $('#reader').classList.add('on');$('#rdSt').textContent=done?'Đã đọc xong.':'Đã dừng đọc.';
  setTimeout(()=>{if(!TTS.on)$('#reader').classList.remove('on')},2500);
}
function rdPauseToggle(){
  if(!TTS.on)return;
  TTS.gen++;
  if(TTS.paused){TTS.paused=false;ui();const g=TTS.gen;speakNext(g)}
  else{speechSynthesis.cancel();TTS.paused=true;ui();status()}
}
$('#rdTab').onclick=()=>rdStart(itemsTab());
$('#rdAll').onclick=()=>rdStart(itemsAll());
$('#rdStop').onclick=()=>rdStop(false);
$('#rdPause').onclick=rdPauseToggle;
$('#rdTest').onclick=()=>{
  if(!HAS_TTS)return;if(!TTS.voices.length)loadVoices();speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance('Xin chào các em. Đây là giọng đọc tiếng Việt của bài học Ngọc Hồi, Đống Đa.');
  u.lang='vi-VN';if(TTS.voice){u.voice=TTS.voice;u.lang=TTS.voice.lang}u.rate=TTS.rate;speechSynthesis.speak(u)};
$('#rdCfg').onclick=e=>{const r=$('#reader'),o=!r.classList.contains('open');r.classList.toggle('open',o);e.currentTarget.setAttribute('aria-expanded',o)};
$('#rdVoice').onchange=e=>{
  TTS.voice=TTS.voices.find(v=>v.voiceURI===e.target.value)||null;
  try{localStorage.setItem('nhdd-voice',e.target.value)}catch(_){}
  if(TTS.on&&!TTS.paused){TTS.gen++;speechSynthesis.cancel();const g=TTS.gen;setTimeout(()=>speakNext(g),90)}
};
$('#rdRate').oninput=e=>{TTS.rate=+e.target.value;$('#rdRateV').textContent=String(TTS.rate).replace('.',',')+'×'};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="rdcap"]');if(!b)return;
  const t=capText();rdStart([{l:'Sa bàn',t:(t.n?t.n+'. ':'')+t.k+'. '+t.x}]);
});
if(HAS_TTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;addEventListener('pagehide',()=>speechSynthesis.cancel())}
else{$('#rdTab').disabled=true;$('#rdAll').disabled=true;$('#rdNote').textContent='Trình duyệt này không hỗ trợ đọc bằng giọng nói.'}

/* ---------- Âm thanh bật/tắt ---------- */
function syncSnd(){const b=$('#sndBtn'),o=sfx.on();b.setAttribute('aria-pressed',o);b.textContent='Âm thanh: '+(o?'bật':'tắt')}
$('#sndBtn').onclick=()=>{sfx.set(!sfx.on());syncSnd()};
syncSnd();

/* ---------- Khởi động ---------- */
buildContent();renderReview();renderQuiz();setStep(0,true);syncScroll();


</script>
