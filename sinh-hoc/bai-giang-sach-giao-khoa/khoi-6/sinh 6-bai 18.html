:root{

*{box-sizing:border-box}

.vline.sel{stroke:#f26a10;stroke-width:3}

.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;flex:none;border-bottom:1px solid var(--line);background:var(--soft)}

.pane{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin}

h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.2;text-wrap:balance}
h3{font-size:17px;color:var(--teal);margin:14px 0 6px}
h4{font-size:15px;margin:10px 0 4px}
p{margin:0 0 8px}
.pane ul{margin:0 0 8px;padding-left:18px}
.sel-card{background:var(--soft);border-radius:12px;padding:10px 12px;border-left:5px solid var(--orange)}

.sel-card .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0;border-bottom:1px dashed var(--line)}
.sel-card .kv:last-of-type{border:0}
.q{background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:500}
details{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
.fc-grid{display:grid;gap:8px}
.fc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--panel);min-height:58px}
.fc .t{font-weight:600}.fc .b{display:none;color:var(--green);margin-top:4px}
.fc.flip{background:var(--soft)}.fc.flip .b{display:block}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;margin:6px 0}

.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}.progress i{display:block;height:100%;background:var(--orange);transition:width .3s}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

var LESSON='<h3>Mục tiêu bài học</h3><ul><li>Nêu được khái niệm, chức năng của tế bào.</li><li>Nhận biết được tế bào là đơn vị cấu trúc của sự sống.</li><li>Nêu được hình dạng và kích thước của một số loại tế bào.</li></ul>'
+'<h3>I. Tế bào là gì?</h3><p>Tất cả các cơ thể sinh vật (thực vật, động vật, con người,…) đều được cấu tạo từ những đơn vị rất nhỏ bé, gọi là <b>tế bào</b>.</p><p>Tuy có kích thước nhỏ nhưng tế bào có thể thực hiện đầy đủ các quá trình sống cơ bản như sinh trưởng (lớn lên), hấp thụ chất dinh dưỡng, hô hấp, cảm ứng, bài tiết và sinh sản.</p><div class="q">❓ Tại sao tế bào được coi là đơn vị cơ bản của các cơ thể sống?</div>'
+'<h3>II. Hình dạng và kích thước tế bào</h3><h4>1. Hình dạng tế bào</h4><p>Có nhiều loại tế bào. Hình dạng các loại tế bào thường phản ánh chức năng khác nhau của chúng. (Hình 18.1: tế bào da, tế bào thần kinh, tế bào vi khuẩn, tế bào lá cây.)</p>'
+'<h4>2. Kích thước tế bào</h4><p>Kích thước tế bào khác nhau giữa các nhóm sinh vật và giữa các cơ quan trong một cơ thể.</p><p>Có rất ít tế bào đủ lớn để quan sát được bằng mắt thường, hầu hết tế bào đều rất nhỏ và chỉ có thể quan sát thấy bằng kính hiển vi.</p><div class="q">❓ Quan sát kích thước tế bào vi khuẩn, tế bào động vật và thực vật trong Hình 18.2, cho biết tế bào nào phải quan sát bằng kính hiển vi, tế bào nào có thể quan sát bằng mắt thường?</div>'
+'<h3>Em có biết?</h3><h4>Tế bào đầu tiên được nhìn thấy và mô tả như thế nào?</h4><p>Năm 1665, nhà khoa học người Anh Robert Hooke dùng kính hiển vi đơn giản (Hình 18.3a) quan sát một mẫu vỏ cây và thấy nó được tạo nên từ hàng trăm cấu trúc giống những hộp nhỏ mà ông gọi là “tế bào”. Ông vẽ hình ảnh đầu tiên về tế bào (Hình 18.3b): đó là những tế bào chết của vỏ cây, ngày nay quan sát rõ hơn bằng kính hiển vi có độ phóng đại 300 lần (Hình 18.3c).</p>'
+'<h4>Tại sao hầu hết các tế bào có kích thước rất nhỏ?</h4><p>Kích thước tế bào bị hạn chế bởi mối quan hệ giữa diện tích bề mặt (S) và thể tích (V), tức tỉ lệ S/V. Khi tế bào lớn lên, thể tích tăng nhanh hơn nhiều so với diện tích bề mặt.</p><p>Oxygen, chất dinh dưỡng và chất thải (như carbon dioxide) phải đi vào, đi ra qua bề mặt tế bào, nên nếu tế bào quá lớn thì các chất ra vào không đủ về lượng và tốc độ theo yêu cầu của các quá trình sống. Vì vậy, hầu hết tế bào có kích thước rất nhỏ.</p>';
function renderDesc(){

  if(mode==='scale'){
    if(sel){var it=byId[sel],tl=toolsAt(it.x);
      h+='<div class="sel-card"><h2>'+it.name+'</h2><div class="kv"><span>Vị trí trên thước</span><b>≈ '+fmtNm(it.nm)+'</b></div><div class="kv"><span>Quan sát bằng</span><b>'+(tl.length?tl.join(', '):'không thuộc dải nào trong hình')+'</b></div><p style="margin:6px 0 0">'+it.info+'</p></div>';}
    else h+='<div class="sel-card"><h2>Hình 18.2</h2><p style="margin:0">Bấm vào một sinh vật, tế bào hoặc phân tử trên thước để xem kích thước và dụng cụ quan sát. Kéo thanh “Kích thước vật thể” để xem vật có kích thước đó cần kính nào.</p></div>';
  } else if(mode==='shape'){
    if(selCell)h+='<div class="sel-card"><h2>'+selCell.name+'</h2><div class="kv"><span>Hình dạng</span><b>'+selCell.shape+'</b></div><div class="kv"><span>Chức năng</span><b>'+selCell.fn+'</b></div><p style="margin:6px 0 0">'+selCell.info+'</p></div>';
    else h+='<div class="sel-card"><h2>Hình 18.1</h2><p style="margin:0">Hình dạng các loại tế bào thường phản ánh chức năng khác nhau của chúng. Bấm vào từng hình tròn để xem chi tiết.</p></div>';
  } else h+='<div id="svCard"></div>';
  h+=LESSON; var p=$('p-desc'),st=p.scrollTop; p.innerHTML=h; p.scrollTop=st; if(mode==='sv')renderDescSV();
}
function renderDescSV(){
  var el=$('svCard'); if(!el||mode!=='sv')return; var c=svCalc(SV.L),ok=c.R>=SV.need;
  el.innerHTML='<div class="sel-card"><h2>Mô phỏng tỉ lệ S/V</h2><div class="kv"><span>S (diện tích bề mặt)</span><b>'+num(c.S,1)+'</b></div><div class="kv"><span>V (thể tích)</span><b>'+num(c.V,1)+'</b></div><div class="kv"><span>S/V</span><b>'+num(c.R,2)+'</b></div><p style="margin:6px 0 0">'+(ok?'Bề mặt còn đủ lớn so với thể tích: oxygen, chất dinh dưỡng vào kịp, chất thải ra kịp.':'Thể tích tăng nhanh hơn bề mặt: vùng giữa tế bào thiếu chất, nên hầu hết tế bào phải có kích thước rất nhỏ.')+'</p><p style="margin:6px 0 0;font-size:12.5px;color:var(--muted)">Thử bấm “Tế bào lớn gấp đôi ×2”: S tăng 4 lần, V tăng 8 lần, S/V giảm một nửa.</p></div>';
}

/* ===== Ôn tập ===== */
var CARDS=[
 ['Tế bào là gì?','Đơn vị rất nhỏ cấu tạo nên mọi cơ thể sinh vật; là đơn vị cơ bản của sự sống.'],
 ['Tế bào thực hiện được những quá trình sống nào?','Sinh trưởng, hấp thụ chất dinh dưỡng, hô hấp, cảm ứng, bài tiết, sinh sản.'],
 ['Hình dạng tế bào phản ánh điều gì?','Chức năng khác nhau của từng loại tế bào.'],
 ['Tế bào thần kinh có hình dạng thế nào?','Thân có nhiều nhánh dài, giúp truyền thông tin.'],
 ['Tế bào nào quan sát được bằng mắt thường (Hình 18.2)?','Tế bào trứng cá (cỡ mm). Tế bào vi khuẩn, động vật, thực vật phải dùng kính hiển vi.'],
 ['Ai là người đầu tiên mô tả tế bào, vào năm nào?','Robert Hooke, năm 1665, quan sát vỏ cây (tế bào chết) bằng kính hiển vi đơn giản.'],
 ['Vì sao hầu hết tế bào rất nhỏ?','Kích thước bị giới hạn bởi tỉ lệ S/V: tế bào lớn thì S/V giảm, chất ra vào không đủ nhu cầu.'],
 ['Khi tế bào lớn lên, S/V thay đổi thế nào?','Giảm, vì thể tích tăng nhanh hơn nhiều so với diện tích bề mặt.']
];
function renderRev(){
  var h='<h3 style="margin-top:0">Em đã học</h3><ul><li>Mọi cơ thể sống đều được cấu tạo từ tế bào, vì vậy tế bào được xem là “đơn vị cơ bản của sự sống”.</li><li>Các loại tế bào khác nhau về hình dạng và kích thước.</li></ul><div class="q">Em có thể: giải thích được vì sao mỗi loại tế bào lại có hình dạng khác nhau.</div>';
  h+='<h3>Thẻ ôn tập (bấm để lật)</h3><div class="fc-grid">'+CARDS.map(function(c,i){return '<button class="fc" data-i="'+i+'"><div class="t">'+esc(c[0])+'</div><div class="b">'+esc(c[1])+'</div></button>'}).join('')+'</div>';
  h+='<h3>Gợi ý trả lời câu hỏi trong bài</h3>'
   +'<details><summary>Tại sao tế bào được coi là đơn vị cơ bản của các cơ thể sống?</summary><p>Vì mọi cơ thể sống đều cấu tạo từ tế bào và tế bào thực hiện đầy đủ các quá trình sống cơ bản.</p></details>'
   +'<details><summary>Quan sát Hình 18.1, nhận xét về hình dạng tế bào.</summary><p>Tế bào có nhiều hình dạng: dẹt nhiều góc (da), nhiều nhánh (thần kinh), hình que (vi khuẩn), hình hộp (lá cây). Hình dạng phản ánh chức năng.</p></details>'
   +'<details><summary>Tế bào nào phải quan sát bằng kính hiển vi, tế bào nào quan sát bằng mắt thường?</summary><p>Vi khuẩn, tế bào động vật và thực vật phải quan sát bằng kính hiển vi. Chỉ rất ít tế bào đủ lớn để nhìn bằng mắt thường, ví dụ trứng cá.</p></details>'
   +'<details><summary>Phát biểu của bạn nào đúng?</summary><p><b>Bạn D</b> đúng: các loại tế bào khác nhau thường có kích thước và hình dạng khác nhau. A, B, C sai: tế bào có thể giống nhau về hình dạng (vd. nhiều tế bào lá cây đều hộp chữ nhật) nhưng kích thước vẫn khác nhau, và không phải loại nào cũng cùng kích thước (vd. trứng cá lớn hơn tế bào vi khuẩn rất nhiều). Ví dụ tế bào thần kinh nhiều nhánh khác hẳn tế bào da dẹt, nên hình dạng không giống nhau.</p></details>';
  var p=$('p-rev'); p.innerHTML=h;
  p.querySelectorAll('.fc').forEach(function(b){b.onclick=function(){b.classList.toggle('flip');sfx.click()}});
}

/* ===== Trắc nghiệm ===== */
var QS=[
 {q:'Đơn vị cơ bản cấu tạo nên cơ thể sinh vật là gì?',o:['Mô','Tế bào','Cơ quan','Hệ cơ quan'],a:1,e:'Mọi cơ thể sinh vật đều được cấu tạo từ tế bào.'},
 {q:'Tế bào có thể thực hiện đầy đủ các quá trình sống nào sau đây?',o:['Chỉ sinh trưởng','Chỉ hô hấp và bài tiết','Sinh trưởng, hấp thụ dinh dưỡng, hô hấp, cảm ứng, bài tiết, sinh sản','Chỉ sinh sản'],a:2,e:'Tế bào thực hiện đầy đủ các quá trình sống cơ bản nên là đơn vị cơ bản của sự sống.'},
 {q:'Hình dạng của các loại tế bào thường phản ánh điều gì?',o:['Tuổi của tế bào','Màu sắc của tế bào','Chức năng khác nhau của chúng','Vị trí trong không gian'],a:2,e:'Hình dạng tế bào gắn với chức năng, ví dụ tế bào thần kinh nhiều nhánh để truyền thông tin.'},
 {q:'Tế bào nào có hình dạng nhiều nhánh dài?',o:['Tế bào da ở người','Tế bào thần kinh ở người','Tế bào vi khuẩn','Tế bào ở lá cây'],a:1,e:'Tế bào thần kinh có thân và nhiều sợi nhánh dài (Hình 18.1b).'},
 {q:'Theo Hình 18.2, loại tế bào nào có thể quan sát bằng mắt thường?',o:['Tế bào vi khuẩn','Virus','Tế bào trứng cá','Tế bào động vật và thực vật'],a:2,e:'Trứng cá cỡ mm nằm trong dải “Mắt thường”; các tế bào còn lại phải dùng kính hiển vi.'},
 {q:'Muốn quan sát tế bào vi khuẩn cần dùng dụng cụ nào?',o:['Mắt thường','Kính lúp cầm tay','Kính hiển vi','Ống nhòm'],a:2,e:'Vi khuẩn rất nhỏ (cỡ µm), chỉ thấy bằng kính hiển vi.'},
 {q:'Trong 4 ý kiến A, B, C, D ở bài, phát biểu nào đúng?',o:['A','B','C','D'],a:3,e:'D: các loại tế bào khác nhau thường có kích thước và hình dạng khác nhau.'},
 {q:'Ai là người đầu tiên quan sát và mô tả tế bào vào năm 1665?',o:['Robert Hooke','Louis Pasteur','Charles Darwin','Gregor Mendel'],a:0,e:'Robert Hooke quan sát vỏ cây bằng kính hiển vi đơn giản và gọi các “hộp nhỏ” là tế bào.'},
 {q:'Vì sao hầu hết các tế bào có kích thước rất nhỏ?',o:['Vì tế bào không thể lớn lên','Vì tỉ lệ S/V giảm khi tế bào lớn, chất ra vào không đủ nhu cầu','Vì tế bào không có thể tích','Vì mắt thường không nhìn thấy'],a:1,e:'Chất ra vào qua bề mặt, nhu cầu theo thể tích; tế bào lớn thì S/V giảm.'},
 {q:'Khi tế bào lớn lên, thể tích và diện tích bề mặt thay đổi thế nào?',o:['Cả hai tăng như nhau','Diện tích tăng nhanh hơn thể tích','Thể tích tăng nhanh hơn nhiều so với diện tích bề mặt','Cả hai không đổi'],a:2,e:'Với khối lập phương: S = 6L², V = L³ nên V tăng nhanh hơn S.'}
];
var qs={i:0,score:0,ans:false,order:[]};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function quizStart(){qs={i:0,score:0,ans:false,order:shuffle(QS.map(function(_,i){return i}))};renderQuiz()}
function renderQuiz(){
  var p=$('p-quiz'),h='';
  if(qs.i>=QS.length){
    var pct=Math.round(qs.score/QS.length*100);
    h='<div class="sel-card" style="text-align:center"><div class="score">'+qs.score+' / '+QS.length+'</div><p>'+(pct>=80?'Xuất sắc! Em đã nắm vững bài học.':pct>=50?'Khá tốt! Hãy xem lại phần Ôn tập để chắc hơn.':'Cố lên! Em hãy đọc lại bài và thử lần nữa.')+'</p><button class="btn" id="qRetry">Làm lại</button></div>';
    p.innerHTML=h; $('qRetry').onclick=function(){sfx.click();quizStart()}; return;
  }
  var q=QS[qs.order[qs.i]];
  h='<div class="progress"><i style="width:'+(qs.i/QS.length*100)+'%"></i></div><p style="color:var(--muted);font-size:12.5px;margin-bottom:4px">Câu '+(qs.i+1)+'/'+QS.length+' · Điểm: '+qs.score+'</p><h4 style="margin-top:0">'+esc(q.q)+'</h4>';
  var order=q._o||(q._o=(q.o.length===4&&q.q.indexOf('A, B, C, D')>0?[0,1,2,3]:shuffle(q.o.map(function(_,i){return i}))));
  order.forEach(function(oi){h+='<button class="opt" data-o="'+oi+'">'+esc(q.o[oi])+'</button>'});
  h+='<div id="qFb"></div>'; p.innerHTML=h;
  p.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    if(qs.ans)return; qs.ans=true; var o=+b.dataset.o, ok=o===q.a;
    p.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(+x.dataset.o===q.a)x.classList.add('right')});
    if(ok){qs.score++;sfx.good()}else{b.classList.add('wrong');sfx.bad()}
    $('qFb').innerHTML='<div class="expl"><b>'+(ok?'Chính xác! ':'Chưa đúng. ')+'</b>'+esc(q.e)+'</div><p style="margin-top:10px"><button class="btn" id="qNext">'+(qs.i+1<QS.length?'Câu tiếp theo →':'Xem kết quả')+'</button></p>';
    $('qNext').onclick=function(){sfx.click();qs.i++;qs.ans=false;QS.forEach(function(x){delete x._o});renderQuiz()};
  }});
}

/* ===== Khởi động ===== */
renderRev(); quizStart();
selectItem('egg',true);
document.addEventListener('pointerdown',function f(){AC();document.removeEventListener('pointerdown',f)},{once:true});
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Chặn phím tắt: F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S
    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();

      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) || 
        (e.ctrlKey && (key === 'u' || key === 's'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 2. Chặn chuột phải (Context Menu)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  });
</script>
