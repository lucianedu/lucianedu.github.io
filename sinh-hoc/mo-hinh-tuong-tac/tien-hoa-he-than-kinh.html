<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tiến hóa hệ thần kinh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: khung mô hình 3/4 bên trái (cuộn riêng, chân khung cố định), bảng tab 1/4 bên phải (cuộn riêng). */
:root{
  --bg:#E9F0EF; --panel:#FFFFFF; --panel-2:#F3F7F6; --ink:#123038; --ink-2:#4A6168; --line:#D0DCDA;
  --accent:#0E8A8C; --accent-ink:#06595B; --accent-soft:#D5EDED; --on-accent:#FFFFFF; --glow:rgba(14,138,140,.55);
  --orange:#E85D0C;
  --p-olf:#4FA56A; --p-cer:#E2607F; --p-opt:#E9A23B; --p-cbl:#4C79D1; --p-med:#8B6BC4;
  --cell:#CDE8E3; --cell-line:#4E9A94; --body-fill:#F4D9C6; --body-line:#C98B66; --nerve:#7458D0;
  --good:#1D8A52; --bad:#C23B2B;
  --f-display:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1417; --panel:#12232A; --panel-2:#0E1C22; --ink:#E4F0EE; --ink-2:#9DB5B6; --line:#243A41;
    --accent:#38C2C0; --accent-ink:#8FE3E1; --accent-soft:#123A40; --on-accent:#062226; --glow:rgba(56,194,192,.6);
    --orange:#FF8A3D;
    --p-olf:#6CC384; --p-cer:#F07C98; --p-opt:#F2B85A; --p-cbl:#6F9BEA; --p-med:#A88BE0;
    --cell:#1F4B4D; --cell-line:#5CC0B8; --body-fill:#4A3428; --body-line:#D9A07B; --nerve:#A98CF2;
    --good:#4CC98A; --bad:#F2796A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1417; --panel:#12232A; --panel-2:#0E1C22; --ink:#E4F0EE; --ink-2:#9DB5B6; --line:#243A41;
  --accent:#38C2C0; --accent-ink:#8FE3E1; --accent-soft:#123A40; --on-accent:#062226; --glow:rgba(56,194,192,.6);
  --orange:#FF8A3D;
  --p-olf:#6CC384; --p-cer:#F07C98; --p-opt:#F2B85A; --p-cbl:#6F9BEA; --p-med:#A88BE0;
  --cell:#1F4B4D; --cell-line:#5CC0B8; --body-fill:#4A3428; --body-line:#D9A07B; --nerve:#A98CF2;
  --good:#4CC98A; --bad:#F2796A; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
}
button{font:inherit; color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance}

.app{height:100%; display:grid; grid-template-columns:minmax(0,3fr) minmax(320px,1fr); gap:14px}
.stage,.side{min-height:0; min-width:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden}

/* ---------- Khung mô hình ---------- */
.stage-top{flex:none; padding:14px 18px 12px; border-bottom:1px solid var(--line); display:grid; gap:10px}
.title-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px}
.title-row h1{font-size:21px; font-weight:800; letter-spacing:-.01em; line-height:1.2}
.title-row small{display:block; color:var(--ink-2); font-size:13px; font-weight:500; margin-top:2px}
.tools{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.grp{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--panel-2)}
.grp .btn{border:0; border-radius:0}
.grp .btn+.btn{border-left:1px solid var(--line)}
.btn{font-weight:600; font-size:13px; padding:6px 11px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); cursor:pointer; line-height:1.3; transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn:focus-visible,.node:focus-visible,.tab:focus-visible,.opt:focus-visible,.fc:focus-visible,.tcard:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.zoom-val{min-width:50px; text-align:center; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; padding:0 4px; color:var(--ink-2)}
.filters{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.filters .lbl{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin-right:4px}
.fchip{font-weight:600; font-size:13px; padding:5px 12px; border-radius:99px; border:1.5px solid var(--line); background:var(--panel); cursor:pointer; transition:all .15s}
.fchip:hover{border-color:var(--accent)}
.fchip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.fchip .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--accent)}
.hint{min-height:22px; font-size:14px; color:var(--ink-2)}
.hint b{color:var(--ink); font-weight:700}

.canvas{flex:1; min-height:0; overflow:auto; padding:18px; background-image:radial-gradient(var(--line) 1px,transparent 1.2px); background-size:20px 20px; background-color:var(--panel-2); overscroll-behavior:contain}
.board{min-width:760px; display:grid; gap:10px; transform-origin:0 0}

.cwrap{flex:1; min-height:0; position:relative; display:flex; flex-direction:column}
.zv{position:absolute; inset:0; z-index:5; display:grid; place-items:center; padding:16px; background:color-mix(in srgb,var(--bg) 84%,transparent); backdrop-filter:blur(3px)}
.zv[hidden]{display:none}
.zcard{width:min(820px,100%); max-height:100%; overflow:auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); background:var(--panel); border:1.5px solid var(--accent); border-radius:16px; box-shadow:0 26px 60px -22px var(--glow); animation:zin .24s ease-out}
@keyframes zin{from{opacity:0; transform:scale(.84)}to{opacity:1; transform:none}}
.zart{padding:20px; display:grid; place-items:center; background:var(--panel-2); min-width:0}
.zart svg{width:100%; max-width:380px; max-height:min(62vh,500px); height:auto; display:block}
.zart svg [data-part]{transition:opacity .15s}
.zinfo{padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.zhead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.zhead h2{font-size:24px; font-weight:800; line-height:1.2; margin-top:2px}
.zleg{display:grid; gap:5px}
.zl{display:flex; align-items:center; gap:9px; padding:7px 10px; border:1.5px solid transparent; border-radius:9px; background:var(--panel-2); text-align:left; font-weight:600; font-size:14px; cursor:default}
.zl:hover,.zl:focus-visible{border-color:var(--accent); outline:none}
.zl i{width:14px; height:14px; border-radius:50%; flex:none}
.axis{display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
.axis i{flex:1; height:3px; border-radius:3px; background:linear-gradient(90deg,var(--accent-soft),var(--accent)); position:relative}
.axis i::after{content:""; position:absolute; right:-2px; top:-4.5px; border-left:9px solid var(--accent); border-top:6px solid transparent; border-bottom:6px solid transparent}
.axis span:last-child{padding-right:6px}

.row3{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:6px}
.row5{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:6px}
.bridge{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:6px}
.bridge .cap{grid-column:1 / 4; text-align:right; font-size:13px; color:var(--ink-2); font-weight:600; padding-right:10px}
.bridge .arrow{grid-column:5; width:auto; height:46px}

.arrow{display:flex; align-items:center; justify-content:center; width:44px; color:var(--ink-2); opacity:.65; transition:color .25s,opacity .25s}
.arrow svg{width:44px; height:22px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.arrow.down svg{width:24px; height:46px}
.arrow.done{color:var(--accent); opacity:1}
/* Mũi tên khuỷu: từ giữa thẻ Giun đất, đi xuống, rẽ trái, chỉ vào giữa thẻ Não cá.
   Vị trí tính theo cột lưới: hàng 3 thẻ trừ 112px mũi tên/khoảng cách; hàng 5 thẻ trừ 224px, cộng viền và đệm 27px của khung hình ống. */
.arrow.elbow{position:relative; display:block; width:auto; height:60px; margin-bottom:-23.5px; z-index:2}
.elbow i{position:absolute; background:currentColor; border-radius:2px}
.elbow .v1{width:2.6px; top:-10px; height:calc(50% + 11.3px); right:calc((100% - 112px)/6 - 1.3px)}
.elbow .h{height:2.6px; top:calc(50% - 1.3px); left:calc(13.5px + (100% - 251px)/10); right:calc((100% - 112px)/6 - 1.3px)}
.elbow .v2{width:2.6px; top:calc(50% - 1.3px); bottom:7px; left:calc(13.5px + (100% - 251px)/10 - 1.3px)}
.arrow.elbow::after{content:""; position:absolute; bottom:0; left:calc(13.5px + (100% - 251px)/10 - 7px); border-top:10px solid currentColor; border-left:7px solid transparent; border-right:7px solid transparent}
.elbow .cap{position:absolute; left:47%; top:50%; transform:translate(-50%,-135%); font-size:13px; font-weight:600; white-space:nowrap; color:var(--ink-2)}
.arrow.elbow.done .cap{color:var(--accent-ink)}

.tube{border:1.5px dashed var(--line); border-radius:16px; padding:12px 12px 14px; background:color-mix(in srgb,var(--accent-soft) 40%,transparent); display:grid; gap:10px}
.tube h3{text-align:center; font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink)}

.node{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 8px 12px; background:var(--panel); border:1.5px solid var(--line); border-radius:12px; cursor:zoom-in; text-align:center; transition:transform .18s,box-shadow .18s,border-color .18s,opacity .2s}
.node:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 10px 22px -12px var(--glow)}
.node.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft),0 14px 26px -12px var(--glow); transform:translateY(-3px)}
.board:has(.node:hover) .node:not(:hover):not(.on){opacity:.62}
.board.filtered .node:not(.in){opacity:.3}
.board.filtered .node:not(.in):hover{opacity:.9}
.node .no{position:absolute; top:7px; left:8px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--accent-soft); color:var(--accent-ink); font-variant-numeric:tabular-nums}
.node.on .no{background:var(--accent); color:var(--on-accent)}
.node .art{width:100%; display:flex; justify-content:center}
.node .art svg{width:100%; max-width:112px; height:auto; display:block}
.node .nm{font-family:var(--f-display); font-weight:700; font-size:14.5px; line-height:1.25; margin-top:2px}
.node.on .nm{color:var(--accent-ink)}
.node .sb{font-size:12px; color:var(--ink-2); font-weight:500}

.art svg .cell{fill:var(--cell); stroke:var(--cell-line); stroke-width:2; stroke-linejoin:round}
.art svg .body{fill:var(--body-fill); stroke:var(--body-line); stroke-width:2; stroke-linejoin:round}
.art svg .pa{stroke:var(--ink); stroke-opacity:.3; stroke-width:1}

.credit{flex:none; text-align:center; padding:9px 12px; border-top:1px solid var(--line); background:var(--panel); font-size:13px; letter-spacing:.03em; color:var(--ink-2)}
.credit b{color:var(--orange); font-weight:800; font-size:14px; letter-spacing:.02em}

/* ---------- Bảng tab ---------- */
.tabs{flex:none; display:flex; border-bottom:1px solid var(--line); background:var(--panel-2)}
.tab{flex:1; padding:12px 4px 10px; background:none; border:0; border-bottom:3px solid transparent; font-weight:700; font-size:13.5px; color:var(--ink-2); cursor:pointer; transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); background:var(--panel)}
.pane{flex:1; min-height:0; overflow-y:auto; padding:16px 16px 22px; overscroll-behavior:contain; display:block}
.pane[hidden]{display:none}
.pane>*+*{margin-top:14px}

.kicker{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent-ink)}
.pane h2{font-size:21px; font-weight:800; line-height:1.25; margin-top:2px}
.lead{color:var(--ink-2)}
.d-head{display:flex; gap:14px; align-items:center}
.d-head .art{flex:none; width:92px}
.d-head .art svg{width:100%; height:auto; display:block}
.d-head>div:last-child{min-width:0}
.steps{display:grid; grid-template-columns:repeat(8,1fr); gap:4px}
.steps span{height:6px; border-radius:3px; background:var(--line)}
.steps span.past{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.steps span.cur{background:var(--accent)}
.lbl2{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); margin-bottom:8px}
.pts{list-style:none; margin:0; padding:0; display:grid; gap:9px}
.pts li{position:relative; padding-left:17px}
.pts li::before{content:""; position:absolute; left:0; top:.62em; width:7px; height:7px; border-radius:50%; background:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{padding:3px 11px; border-radius:99px; background:var(--accent-soft); color:var(--accent-ink); font-weight:600; font-size:13.5px}
.legend{display:grid; gap:6px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); font-size:13.5px}
.legend div{display:flex; align-items:center; gap:8px}
.legend i{width:12px; height:12px; border-radius:50%; flex:none}
.navrow{display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap}
.navrow .btn{flex:1 1 130px}
.sec{border-top:1px solid var(--line); padding-top:14px}
.sec h3{font-size:16px; font-weight:700; margin-bottom:8px}

.types{display:grid; gap:8px}
.tcard{display:grid; gap:2px; text-align:left; padding:10px 12px; border:1.5px solid var(--line); border-radius:11px; background:var(--panel); cursor:pointer; transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--accent); transform:translateX(2px)}
.tcard b{font-family:var(--f-display); font-size:14.5px}
.tcard span{font-size:13.5px; color:var(--ink-2)}
.tcard em{font-style:normal; font-size:12px; font-weight:700; color:var(--accent-ink); letter-spacing:.05em; text-transform:uppercase}

.meter{display:grid; grid-template-columns:96px 1fr; align-items:center; gap:4px 10px; font-size:13.5px}
.bars{display:grid; grid-template-columns:repeat(5,1fr); gap:3px}
.bars i{height:8px; border-radius:2px; background:var(--line)}
.bars i.f{background:var(--c,var(--accent))}
.animal{padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); display:grid; gap:7px}
.animal>b{font-family:var(--f-display); font-size:14.5px}
.animal p{font-size:13.5px; color:var(--ink-2)}
.fcs{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
.fc{min-height:96px; padding:10px; border:1.5px solid var(--line); border-radius:11px; background:var(--panel); cursor:pointer; text-align:left; font-size:13.5px; line-height:1.4; display:flex; flex-direction:column; gap:4px; transition:background .2s,border-color .2s}
.fc small{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2)}
.fc.flip{background:var(--accent-soft); border-color:var(--accent)}
.fc.flip small{color:var(--accent-ink)}
.tip{padding:11px 12px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); font-weight:600; font-size:14px}

.qhead{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink-2)}
.qhead .sc{color:var(--accent-ink); font-variant-numeric:tabular-nums}
.prog{height:6px; border-radius:3px; background:var(--line); overflow:hidden}
.prog i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
.qtext{font-family:var(--f-display); font-size:16.5px; font-weight:700; line-height:1.4}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--panel-2); cursor:pointer; line-height:1.4; transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ab{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--line); color:var(--ink)}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--good); background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.opt.bad{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 13%,var(--panel))}
.opt.good .ab{background:var(--good); color:#fff}
.opt.bad .ab{background:var(--bad); color:#fff}
.fb{padding:11px 12px; border-radius:10px; font-size:14px; border:1px solid var(--line); background:var(--panel-2)}
.fb b.g{color:var(--good)} .fb b.b{color:var(--bad)}
.big{font-family:var(--f-display); font-weight:800; font-size:44px; line-height:1; color:var(--accent-ink); font-variant-numeric:tabular-nums}
.wrong-item{padding:10px 12px; border:1px solid var(--line); border-left:4px solid var(--bad); border-radius:8px; font-size:13.5px; display:grid; gap:4px}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent); padding:9px 14px}
.btn.primary:hover{color:var(--on-accent); filter:brightness(1.08)}
.btn.block{width:100%}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto; grid-template-columns:minmax(0,1fr)}
  .stage{height:84vh; min-height:540px}
  .side{height:86vh; min-height:540px}
  .title-row h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important; animation:none!important}
}
</style>

<div class="app">
  <main class="stage" aria-label="Mô hình tiến hóa hệ thần kinh">
    <header class="stage-top">
      <div class="title-row">
        <div>
          <h1>Tiến hóa hệ thần kinh ở động vật</h1>
          <small>Sinh học phổ thông · 8 bậc từ thấp đến cao</small>
        </div>
        <div class="tools" role="toolbar" aria-label="Công cụ mô hình">
          <div class="grp" aria-label="Phóng to thu nhỏ">
            <button class="btn" data-act="zoomout" aria-label="Thu nhỏ">−</button>
            <span class="zoom-val" id="zoomVal" aria-live="polite">100%</span>
            <button class="btn" data-act="zoomin" aria-label="Phóng to">+</button>
          </div>
          <button class="btn" data-act="zoomreset">Đặt lại</button>
          <div class="grp">
            <button class="btn" data-act="prev" aria-label="Bậc trước">← Trước</button>
            <button class="btn" data-act="next" aria-label="Bậc sau">Sau →</button>
          </div>
          <button class="btn" id="soundBtn" data-act="sound" aria-pressed="true" title="Âm thanh càng cao thì bậc tiến hóa càng cao">Âm thanh: Bật</button>
        </div>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Chuyển nhanh giữa các dạng hệ thần kinh"></div>
      <div class="hint" id="hint" aria-live="polite"></div>
    </header>
    <div class="cwrap">
      <div class="canvas" id="canvas">

/* ================= Hình minh họa ================= */
function svgAmip(){
  return '<svg viewBox="0 0 120 140" role="img" aria-label="Trùng biến hình">'+
  '<path data-part="cyt" class="cell" d="M24 70 C14 52 30 34 46 40 C48 22 70 18 76 34 C94 28 108 46 98 62 C112 76 100 98 82 94 C78 114 54 118 48 102 C28 110 14 88 24 70 Z"/>'+
  '<ellipse data-part="nuc" cx="60" cy="68" rx="11" ry="9" fill="var(--p-cbl)" opacity=".85"/><circle data-part="nuc" cx="60" cy="68" r="3" fill="var(--panel)" opacity=".75"/>'+
  '<circle data-part="vac" cx="80" cy="82" r="8" fill="none" stroke="var(--cell-line)" stroke-width="1.6"/><circle data-part="vac" cx="80" cy="82" r="3" fill="var(--p-opt)"/>'+
  '<g fill="var(--cell-line)" opacity=".6"><circle cx="38" cy="60" r="1.7"/><circle cx="46" cy="82" r="1.7"/><circle cx="64" cy="50" r="1.7"/><circle cx="86" cy="56" r="1.7"/><circle cx="58" cy="92" r="1.7"/><circle cx="34" cy="74" r="1.7"/><circle cx="72" cy="66" r="1.5"/></g>'+
  '</svg>';
}
function svgHydra(){
  var pts=[],i,r,c,s='';
  var rows=[52,64,76,88,100,112],cols=4,half=13;
  for(r=0;r<rows.length;r++){for(c=0;c<cols;c++){
    var x=60-half+c*(2*half)/(cols-1)+Math.sin((r+1)*12.9898+(c+1)*78.233)*2.2;
    var y=rows[r]+Math.cos((r+1)*39.346+(c+1)*11.135)*2.2;
    pts.push([x,y]);
  }}
  var lines='';
  for(r=0;r<rows.length;r++){for(c=0;c<cols;c++){
    var a=pts[r*cols+c];
    if(c<cols-1){var b=pts[r*cols+c+1];lines+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"/>';}
    if(r<rows.length-1){var d=pts[(r+1)*cols+c];lines+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+d[0].toFixed(1)+'" y2="'+d[1].toFixed(1)+'"/>';
      if(c<cols-1&&(r+c)%2===0){var e=pts[(r+1)*cols+c+1];lines+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'"/>';}}
  }}
  var dots='';
  for(i=0;i<pts.length;i++){dots+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="2.3"/>';}
  s='<svg viewBox="0 0 120 140" role="img" aria-label="Thủy tức">'+
  '<g data-part="tent" fill="none" stroke="var(--body-line)" stroke-width="3.6" stroke-linecap="round"><path d="M52 40 C44 28 34 26 30 14"/><path d="M56 40 C52 26 46 18 46 8"/><path d="M60 40 C60 26 60 16 60 6"/><path d="M64 40 C68 26 74 18 74 8"/><path d="M68 40 C76 28 86 26 90 14"/></g>'+
  '<path class="body" d="M44 126 C46 100 40 80 44 52 L50 40 L70 40 L76 52 C80 80 74 100 76 126 Z"/>'+
  '<ellipse class="body" cx="60" cy="130" rx="20" ry="5"/>'+
  '<g data-part="nerve" stroke="var(--nerve)" stroke-width="1.2" opacity=".9">'+lines+'</g><g data-part="nerve" fill="var(--nerve)">'+dots+'</g></svg>';
  return s;
}
function svgWorm(){
  var s='<svg viewBox="0 0 120 140" role="img" aria-label="Giun đất">'+
  '<rect class="body" x="40" y="6" width="40" height="128" rx="20"/>';
  var y,lat='',gang='',seg='';
  for(y=22;y<=122;y+=12){seg+='<line x1="'+(y<26||y>114?47:43)+'" y1="'+y+'" x2="'+(y<26||y>114?73:77)+'" y2="'+y+'"/>';}
  for(y=54;y<=122;y+=12){lat+='<line x1="60" y1="'+y+'" x2="43" y2="'+(y+6)+'"/><line x1="60" y1="'+y+'" x2="77" y2="'+(y+6)+'"/>';gang+='<circle cx="60" cy="'+y+'" r="3.4"/>';}
  s+='<g stroke="var(--body-line)" stroke-width="1" opacity=".55">'+seg+'</g>'+
  '<g data-part="nerve" stroke="var(--nerve)" stroke-width="1.2" opacity=".8">'+lat+'</g>'+
  '<path data-part="nerve" d="M52 24 C52 36 56 40 60 41 C64 40 68 36 68 24" fill="none" stroke="var(--nerve)" stroke-width="2"/>'+

  return s;
}
/* Não động vật có xương sống (nhìn từ trên xuống, phía trước ở trên) */
function svgBrain(p,label){
  var cx=60,top=18;
  var rx=6+p.c*0.34, ry=9+p.c*0.62, hx=rx*0.92;
  var cerBottom=top+2*ry;
  var or=3+p.o*0.22, ox=hx*0.75+or+4;
  var oy=p.hide?cerBottom-or*1.6:cerBottom-2;
  var crx=8+p.cb*0.5, cry=4+p.cb*0.25;
  var cbTop=Math.max(cerBottom,oy+or)-2, cby=cbTop+cry;
  var medTop=cby+cry-4;
  var s='<svg viewBox="0 0 120 140" role="img" aria-label="'+label+'">';
  s+='<rect data-part="med" x="54" y="'+(medTop+10)+'" width="12" height="'+(140-medTop-10)+'" rx="5" fill="var(--p-med)" opacity=".9"/>';
  s+='<path data-part="med" class="pa" fill="var(--p-med)" d="M'+(cx-13)+' '+medTop+' Q'+(cx-13)+' '+(medTop+14)+' '+(cx-6)+' '+(medTop+24)+' L'+(cx+6)+' '+(medTop+24)+' Q'+(cx+13)+' '+(medTop+14)+' '+(cx+13)+' '+medTop+' Z"/>';
  var olrx=2.5+p.ol*0.4, olry=3+p.ol*0.6;
  s+='<ellipse data-part="olf" class="pa" fill="var(--p-olf)" cx="'+(cx-hx*0.55)+'" cy="'+(top+1)+'" rx="'+olrx+'" ry="'+olry+'"/><ellipse data-part="olf" class="pa" fill="var(--p-olf)" cx="'+(cx+hx*0.55)+'" cy="'+(top+1)+'" rx="'+olrx+'" ry="'+olry+'"/>';
  s+='<ellipse data-part="cbl" class="pa" fill="var(--p-cbl)" cx="'+cx+'" cy="'+cby+'" rx="'+crx+'" ry="'+cry+'"/>';
  var k;
  for(k=1;k<=p.cf;k++){var yy=cby-cry*0.6+k*(cry*1.2/(p.cf+1));s+='<line data-part="cbl" x1="'+(cx-crx*0.72)+'" y1="'+yy.toFixed(1)+'" x2="'+(cx+crx*0.72)+'" y2="'+yy.toFixed(1)+'" stroke="var(--ink)" stroke-opacity=".3" stroke-width="1"/>';}
  s+='<circle data-part="opt" class="pa" fill="var(--p-opt)" cx="'+(cx-ox)+'" cy="'+oy+'" r="'+or+'"/><circle data-part="opt" class="pa" fill="var(--p-opt)" cx="'+(cx+ox)+'" cy="'+oy+'" r="'+or+'"/>';
  var cy=top+ry;
  s+='<ellipse data-part="cer" class="pa" fill="var(--p-cer)" cx="'+(cx-hx)+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/><ellipse data-part="cer" class="pa" fill="var(--p-cer)" cx="'+(cx+hx)+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>';
  for(k=1;k<=p.f;k++){
    var fy=cy-ry*0.62+k*(ry*1.24/(p.f+1));
    [-1,1].forEach(function(sd){
      var x0=cx+sd*hx-rx*0.7;
      s+='<path data-part="cer" d="M'+x0.toFixed(1)+' '+fy.toFixed(1)+' q'+(rx*0.23).toFixed(1)+' -5 '+(rx*0.47).toFixed(1)+' 0 t'+(rx*0.47).toFixed(1)+' 0 t'+(rx*0.47).toFixed(1)+' 0" fill="none" stroke="var(--ink)" stroke-opacity=".32" stroke-width="1.1" stroke-linecap="round"/>';
    });
  }
  s+='</svg>';
  return s;
}

var AC=null,soundOn=true,unlocked=false;
function ctx(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,d,type,v,t0,slide){
  if(!soundOn||!unlocked)return;
  var a=ctx(); if(!a)return;
  try{
    var t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.08,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}
var sfx={
  hover:function(i){tone(NODES[i].tone*2,0.07,'sine',0.025);},
  select:function(i){var f=NODES[i].tone;tone(f,0.28,'triangle',0.09);tone(f*1.5,0.3,'sine',0.045,0.07);tone(f*2,0.36,'sine',0.03,0.14);},
  tab:function(){tone(660,0.06,'sine',0.04);tone(880,0.08,'sine',0.035,0.05);},
  tick:function(){tone(520,0.05,'sine',0.04);},
  zoom:function(up){tone(up?420:340,0.12,'sine',0.05,0,up?640:260);},
  ok:function(){tone(523.25,0.14,'sine',0.09);tone(659.25,0.14,'sine',0.09,0.1);tone(783.99,0.26,'sine',0.09,0.2);},
  bad:function(){tone(220,0.28,'sawtooth',0.05,0,110);tone(165,0.3,'square',0.03,0.08,98);},
  win:function(){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,k){tone(f,0.3,'triangle',0.08,k*0.11);});}
};
function unlock(){unlocked=true;ctx();}
document.addEventListener('pointerdown',unlock,{once:true});

function firstOf(g){for(var i=0;i<NODES.length;i++){if(NODES[i].g===g)return i;}return 0;}
function setHint(i){
  if(i<0){hintEl.innerHTML='Rê chuột vào một ô để xem nhanh, bấm để phóng to hình và xem chi tiết.';return;}
  hintEl.innerHTML='<b>'+NODES[i].name+'</b> · '+NODES[i].hint;
}
function centerNode(i){
  var el=$('.node[data-i="'+i+'"]',board); if(!el)return;
  var r=el.getBoundingClientRect(),cr=canvas.getBoundingClientRect();
  canvas.scrollBy({left:r.left-cr.left-(cr.width-r.width)/2,top:r.top-cr.top-(cr.height-r.height)/2,behavior:'smooth'});
}
function paint(){
  $$('.node',board).forEach(function(el){
    var i=+el.dataset.i,on=i===sel;
    el.classList.toggle('on',on); el.setAttribute('aria-pressed',on?'true':'false');
    el.classList.toggle('in',filter!=='all'&&NODES[i].g===filter);
  });
  board.classList.toggle('filtered',filter!=='all');
  $$('.arrow',board).forEach(function(a){a.classList.toggle('done',sel>=0&&(+a.dataset.after)<sel);});
  $$('.fchip').forEach(function(c){c.setAttribute('aria-pressed',c.dataset.f===filter?'true':'false');});
}
function select(i,opt){
  opt=opt||{};
  if(i<0){sel=-1;closeZoom();paint();setHint(-1);renderDesc();return;}
  i=Math.max(0,Math.min(NODES.length-1,i));
  sel=i; paint(); setHint(i); renderDesc();
  if(!opt.silent){setTab('desc',true);sfx.select(i);}
  if(zoomOpen)renderZoom();
  if(opt.center!==false)centerNode(i);
}
function setZoom(z,up){
  zoom=z; board.style.zoom=z; $('#zoomVal').textContent=Math.round(z*100)+'%';
  if(up!==undefined)sfx.zoom(up);
}
function stepZoom(d){
  var k=ZS.indexOf(zoom); if(k<0)k=4;
  var nk=Math.max(0,Math.min(ZS.length-1,k+d));
  if(nk!==k)setZoom(ZS[nk],d>0); else sfx.tick();
}

}

/* ================= Tab Trắc nghiệm ================= */
var Q={state:'intro',list:[],i:0,score:0,streak:0,best:0,done:false,wrong:[]};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(){
  Q.list=shuffle(BANK).slice(0,10).map(function(q){
    var idx=shuffle(q.o.map(function(_,k){return k;}));
    return {q:q.q,o:idx.map(function(k){return q.o[k];}),a:idx.indexOf(q.a),e:q.e,n:q.n};
  });
  Q.i=0;Q.score=0;Q.streak=0;Q.best=0;Q.done=false;Q.wrong=[];Q.state='play';
  renderQuiz();
}
function renderQuiz(){
  var p=$('#p-quiz'),h='',L='ABCD';
  if(Q.state==='intro'){
    h='<div><div class="kicker">Trò chơi</div><h2>Thử thách 10 câu</h2></div>'+
    '<p class="lead">Mỗi lượt gồm 10 câu chọn ngẫu nhiên từ ngân hàng 12 câu, đáp án được xáo trộn. Sau mỗi câu có lời giải thích và nút xem lại trên mô hình.</p>'+
    '<div class="tip">Trả lời đúng liên tiếp để tạo chuỗi. Âm thanh báo đúng hoặc sai sau mỗi câu.</div>'+
    '<button class="btn primary block" data-act="startquiz">Bắt đầu</button>';
  }else if(Q.state==='play'){
    var q=Q.list[Q.i];
    h='<div class="qhead"><span>Câu '+(Q.i+1)+'/'+Q.list.length+'</span><span class="sc">Điểm '+Q.score+(Q.streak>=2?' · chuỗi '+Q.streak:'')+'</span></div>'+
    '<div class="prog"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div>'+
    '<p class="qtext">'+q.q+'</p><div class="opts">'+
    q.o.map(function(t,k){return '<button class="opt" data-act="answer" data-k="'+k+'"><span class="ab">'+L[k]+'</span><span>'+t+'</span></button>';}).join('')+'</div>'+
    '<div id="qfb"></div>';
  }else{
    var pct=Q.score/(Q.list.length*10),msg=pct>=0.9?'Xuất sắc! Bạn nắm rất vững kiến thức này.':pct>=0.7?'Tốt lắm! Ôn thêm vài ý là hoàn hảo.':pct>=0.5?'Khá. Hãy xem lại tab Ôn tập rồi thử lại.':'Cần ôn thêm. Bấm vào từng bậc trên mô hình để xem lại nhé.';
    h='<div><div class="kicker">Kết quả</div><div class="big">'+Q.score+'<span style="font-size:20px;color:var(--ink-2)">/'+(Q.list.length*10)+'</span></div></div>'+
    '<p class="lead">Đúng '+(Q.score/10)+'/'+Q.list.length+' câu · chuỗi đúng dài nhất: '+Q.best+'. '+msg+'</p>';
    if(Q.wrong.length){
      h+='<div class="sec"><h3>Cần xem lại</h3><div style="display:grid;gap:8px">'+Q.wrong.map(function(w){
        return '<div class="wrong-item"><b>'+w.q+'</b><span>Đáp án đúng: '+w.o[w.a]+'</span><span>'+w.e+'</span>'+(w.n!==undefined?'<button class="btn" data-act="viewnode" data-i="'+w.n+'">Xem trên mô hình</button>':'')+'</div>';
      }).join('')+'</div></div>';
    }
    h+='<div class="navrow"><button class="btn primary" data-act="startquiz">Chơi lại</button><button class="btn" data-act="tab" data-tab="review">Mở tab Ôn tập</button></div>';
  }
  p.innerHTML=h; p.scrollTop=0;
}
function answer(k){
  if(Q.done)return;
  var q=Q.list[Q.i],ok=(k===q.a);
  Q.done=true;
  $$('#p-quiz .opt').forEach(function(b,idx){
    b.disabled=true;
    if(idx===q.a)b.classList.add('good');
    else if(idx===k)b.classList.add('bad');
  });
  if(ok){Q.score+=10;Q.streak++;Q.best=Math.max(Q.best,Q.streak);sfx.ok();}
  else{Q.streak=0;Q.wrong.push(q);sfx.bad();}
  var last=Q.i===Q.list.length-1;
  $('#qfb').innerHTML='<div class="fb"><b class="'+(ok?'g':'b')+'">'+(ok?'Chính xác!':'Chưa đúng.')+'</b> '+q.e+'</div>'+
    '<div class="navrow" style="margin-top:10px">'+(q.n!==undefined?'<button class="btn" data-act="viewnode" data-i="'+q.n+'">Xem trên mô hình</button>':'')+
    '<button class="btn primary" data-act="nextq">'+(last?'Xem kết quả':'Câu tiếp')+'</button></div>';
  var sc=$('#p-quiz .sc'); if(sc)sc.textContent='Điểm '+Q.score+(Q.streak>=2?' · chuỗi '+Q.streak:'');
  var fb=$('#qfb'); if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function nextQ(){
  if(!Q.done)return;
  if(Q.i>=Q.list.length-1){Q.state='end';renderQuiz();sfx.win();return;}
  Q.i++;Q.done=false;renderQuiz();sfx.tick();
}

/* ================= Tab chung ================= */
function setTab(name,quiet){
  tabNow=name;
  ['desc','review','quiz'].forEach(function(t){
    var on=t===name;
    $('#t-'+t).setAttribute('aria-selected',on?'true':'false');
    $('#p-'+t).hidden=!on;
  });
  if(!quiet)sfx.tab();
}

/* ================= Phóng to ================= */
var zv=$('#zv'),zoomOpen=false;
function hl(key){
  $$('[data-part]',zv).forEach(function(el){el.style.opacity=(!key||el.dataset.part===key)?'':'0.16';});
}
function renderZoom(){
  var i=sel,n=NODES[i]; if(!n)return;
  var prev=i>0?NODES[i-1]:null,next=i<NODES.length-1?NODES[i+1]:null;
  var parts=n.brain?LEGEND:(n.parts||[]);
  var legend=parts.map(function(l){return '<button type="button" class="zl" data-key="'+l[2]+'"><i style="background:var('+l[0]+')"></i>'+l[1]+'</button>';}).join('');
  zv.innerHTML='<div class="zcard" role="dialog" aria-label="Phóng to '+n.name+'">'+
    '<div class="zart">'+n.art()+'</div>'+
    '<div class="zinfo">'+
      '<div class="zhead"><div><div class="kicker">Bậc '+(i+1)+'/8 · '+GROUPS[n.g].tag+'</div><h2>'+n.name+'</h2></div>'+
      '<button class="btn zclose" data-act="zclose" aria-label="Đóng phóng to">Đóng ✕</button></div>'+
      '<p class="lead">'+n.lead+'</p>'+
      (legend?'<div><div class="lbl2">Rê chuột vào tên để làm nổi bật bộ phận</div><div class="zleg">'+legend+'</div></div>':'')+
      '<div><div class="lbl2">Điểm cần quan sát</div>'+list(n.struct)+'</div>'+
      '<div class="navrow">'+(prev?'<button class="btn" data-act="select" data-i="'+(i-1)+'">← '+prev.name+'</button>':'')+(next?'<button class="btn" data-act="select" data-i="'+(i+1)+'">'+next.name+' →</button>':'')+'</div>'+
    '</div></div>';
}
function openZoom(){
  zoomOpen=true; renderZoom(); zv.hidden=false;
  var b=$('.zclose',zv); if(b)b.focus({preventScroll:true});
}
function closeZoom(){
  if(!zoomOpen)return;
  zoomOpen=false; zv.hidden=true; zv.innerHTML='';
  var el=$('.node[data-i="'+sel+'"]',board); if(el)el.focus({preventScroll:true});
}
zv.addEventListener('click',function(e){if(e.target===zv)closeZoom();});
zv.addEventListener('mouseover',function(e){var b=e.target.closest('.zl');if(b)hl(b.dataset.key);});
zv.addEventListener('mouseout',function(e){if(e.target.closest('.zl'))hl(null);});
zv.addEventListener('focusin',function(e){var b=e.target.closest('.zl');if(b)hl(b.dataset.key);});
zv.addEventListener('focusout',function(e){if(e.target.closest('.zl'))hl(null);});

/* ================= Sự kiện ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t)return;
  var a=t.dataset.act;
  if(a==='select'){select(+t.dataset.i);if(t.classList.contains('node'))openZoom();}
  else if(a==='filter'){
    filter=t.dataset.f; sfx.tick();
    if(filter!=='all'){
      var cur=sel>=0?NODES[sel].g:null;
      if(cur!==filter){select(firstOf(filter));return;}
    }
    paint();
  }
  else if(a==='prev'){select(sel<0?0:sel-1);}
  else if(a==='next'){select(sel<0?0:sel+1);}
  else if(a==='zoomin'){stepZoom(1);}
  else if(a==='zoomout'){stepZoom(-1);}
  else if(a==='zoomreset'){setZoom(1,true);canvas.scrollTo({left:0,top:0,behavior:'smooth'});}
  else if(a==='sound'){
    soundOn=!soundOn; t.setAttribute('aria-pressed',soundOn?'true':'false'); t.textContent='Âm thanh: '+(soundOn?'Bật':'Tắt');
    if(soundOn){unlocked=true;sfx.tick();}
  }
  else if(a==='tab'){setTab(t.dataset.tab);}
  else if(a==='flip'){
    var k=+t.dataset.k,f=t.classList.toggle('flip');
    t.innerHTML='<small>'+(f?'Đáp án':'Câu hỏi')+'</small><span>'+(f?FC[k][1]:FC[k][0])+'</span>'; sfx.tick();
  }
  else if(a==='startquiz'){startQuiz();sfx.tick();}
  else if(a==='answer'){answer(+t.dataset.k);}
  else if(a==='nextq'){nextQ();}
  else if(a==='viewnode'){select(+t.dataset.i);}
  else if(a==='zclose'){closeZoom();}
});
var lastHover=-1;
board.addEventListener('mouseover',function(e){
  var n=e.target.closest('.node'); if(!n)return;
  var i=+n.dataset.i; if(i===lastHover)return;
  lastHover=i; setHint(i); sfx.hover(i);
});
board.addEventListener('mouseleave',function(){lastHover=-1;setHint(sel);});
board.addEventListener('focusin',function(e){var n=e.target.closest('.node');if(n)setHint(+n.dataset.i);});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Escape'&&zoomOpen){closeZoom();return;}
  var tg=e.target&&e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key==='ArrowRight'){e.preventDefault();select(sel<0?0:sel+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();select(sel<0?0:sel-1);}
});

/* ================= Khởi tạo ================= */
buildBoard(); buildFilters(); renderReview(); renderQuiz();
select(1,{silent:true,center:false});
setZoom(1);
})();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Chặn phím tắt: F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S
    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();

      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) || 
        (e.ctrlKey && (key === 'u' || key === 's'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 2. Chặn chuột phải (Context Menu)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  });
</script>
