<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thủy triều và Mặt trăng – Mô hình 3D</title>
<style>
:root{--bg:#eaf4fb;--card:#fff;--tx:#10283d;--mu:#4d6a82;--ac:#0a7ac4;--ac2:#e8f3fc;--bd:#cfe0ee;--ok:#1a9a5b;--no:#d23f3f;--pad-t:env(safe-area-inset-top,0px);--pad-b:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07172a;--card:#0f2640;--tx:#e6f1fb;--mu:#93aec6;--ac:#4cb4f5;--ac2:#12365a;--bd:#1d3f63;--ok:#43d38b;--no:#ff7676}}
:root[data-theme="dark"]{--bg:#07172a;--card:#0f2640;--tx:#e6f1fb;--mu:#93aec6;--ac:#4cb4f5;--ac2:#12365a;--bd:#1d3f63;--ok:#43d38b;--no:#ff7676}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
body{padding-top:var(--pad-t);padding-bottom:var(--pad-b)}
#app{display:grid;grid-template-columns:3fr 1fr;height:100%;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 40% 30%,#4a3a5c,#1c1727 55%,#08060d)}
#foot{left:0;right:0;bottom:0;text-align:center;padding:6px 0 calc(6px);font-size:13px;letter-spacing:.3px;background:rgba(8,6,13,.85);border-top:1px solid rgba(255,255,255,.15);pointer-events:none;z-index:6}
#foot b{color:#ff8a1f;font-weight:800}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:absolute;color:#e6f1fb;font-size:13px}
#title{top:10px;left:12px;max-width:55%}
#title b{font-size:18px;display:block}
#title span{opacity:.8}
#read{top:10px;right:12px;background:rgba(5,18,34,.7);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;min-width:170px;backdrop-filter:blur(6px)}
#bar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);margin:6px 0;overflow:hidden}
#bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#39b0ff,#8ff);transition:width .15s}
#ctl{left:10px;right:10px;bottom:42px;background:rgba(5,18,34,.72);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;backdrop-filter:blur(6px)}
#ctl label{display:flex;gap:6px;align-items:center;flex:1 1 220px}
#ctl input[type=range]{flex:1;min-width:80px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:5px 10px}
#ctl button{background:rgba(255,255,255,.1);color:#e6f1fb;border-color:rgba(255,255,255,.22);padding:4px 9px;font-size:12.5px}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#panel{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--bd);background:var(--bg)}
#tabs{display:flex;flex:none;gap:4px;padding:8px 8px 0}
#tabs button{flex:1;border-radius:9px 9px 0 0;padding:7px 2px;font-size:13px;font-weight:600}
#tools{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#tools select{font:inherit;font-size:12.5px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:3px}
.pane{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 18px;-webkit-overflow-scrolling:touch}
.pane.show{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.card h3{margin:0 0 4px;font-size:15px;color:var(--ac);display:flex;justify-content:space-between;gap:6px;align-items:center}
.card p{margin:0}
.sp{font-size:12px;padding:2px 7px}
.fc{cursor:pointer;min-height:70px;transition:.2s}.fc .a{display:none;color:var(--ok);font-weight:600}.fc.f .a{display:block}.fc.f .q{display:none}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px}
.qopt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.qopt.no{background:var(--no);color:#fff;border-color:var(--no)}
.mu{color:var(--mu);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--bd);padding:4px 6px;text-align:left}
#toast{position:fixed;left:50%;bottom:calc(14px + var(--pad-b));transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:9;max-width:90%}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:56% 44%}#panel{border-left:0;border-top:1px solid var(--bd)}#title{display:none}#read{top:6px;right:6px;padding:5px 8px;min-width:0}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="c"></canvas>
  <div class="hud" id="title"><b>🌊 Thủy triều &amp; Mặt trăng</b><span>Kéo để xoay · cuộn/chụm để phóng to · 📍 là người quan sát</span></div>
  <div class="hud" id="read"><div id="phase">Trăng mới</div><div id="spring" class="mu" style="color:#9fd">—</div><div id="bar"><i></i></div><div id="lvl">Nơi 📍: …</div></div>
  <div class="hud" id="ctl">
   <label>🌙 <input id="ph" type="range" min="0" max="360" value="0"><span id="phv" style="min-width:36px">0°</span></label>
   <button data-p="0">Trăng mới</button><button data-p="90">Thượng huyền</button><button data-p="180">Trăng tròn</button><button data-p="270">Hạ huyền</button>
   <button id="bOrb">▶ Mặt trăng quay</button><button id="bRot" class="on">⟳ Trái đất quay</button><button id="bSnd">🔈 Sóng biển</button>
  </div>
  <div class="hud" id="foot">Produced of <b>LucianEdu</b></div>
 </div>
 <div id="panel">
  <div id="tabs"><button data-t="0" class="on">📖 Mô tả</button><button data-t="1">🧠 Ôn tập</button><button data-t="2">🎮 Trò chơi</button></div>
  <div id="tools"><button id="bRead">🔊 Đọc tab</button><button id="bStop">⏹</button><select id="rate" title="Tốc độ đọc"><option value=".8">Chậm</option><option value="1" selected>Vừa</option><option value="1.2">Nhanh</option></select><select id="lv" title="Mức độ"><option value="s">🧒 Tiểu học</option><option value="m" selected>🧑 THCS</option><option value="d">🎓 THPT</option></select></div>
  <div class="pane show" id="p0"></div><div class="pane" id="p1"></div><div class="pane" id="p2"></div>
 </div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:absolute;left:12px;right:12px;top:50%;color:#fff;background:#a22;padding:10px;border-radius:8px;z-index:5;font-size:13px';d.textContent='Lỗi: '+e.message+' (dòng '+e.lineno+')';$('#stage').appendChild(d)});
/* ===== ÂM THANH ===== */
let AC,amb,ambOn=false;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.12,delay=0){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={click:()=>tone(660,.08,'triangle'),ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.13,i*.09)),no:()=>{tone(180,.3,'sawtooth',.09);tone(150,.3,'sawtooth',.09,.12)},flip:()=>tone(880,.06,'square',.05),win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.11))};
function ambient(on){ambOn=on;const a=ac();if(on&&!amb){const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
 const s=a.createBufferSource();s.buffer=b;s.loop=true;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const g=a.createGain();g.gain.value=0;s.connect(f).connect(g).connect(a.destination);s.start();amb={g,f};
 setInterval(()=>{if(!ambOn)return;const t=a.currentTime;f.frequency.setTargetAtTime(350+300*Math.sin(t*.9)**2,t,.3)},200)}
 if(amb)amb.g.gain.setTargetAtTime(on?.35:0,AC.currentTime,.3)}
/* ===== GIỌNG ĐỌC TIẾNG VIỆT ===== */
let reading=false;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',3500)}
function stopSpeak(){reading=false;if('speechSynthesis'in window)speechSynthesis.cancel();$('#bRead').textContent='🔊 Đọc tab';$('#bRead').classList.remove('on')}
function speak(text,done){if(!('speechSynthesis'in window)){toast('Trình duyệt chưa hỗ trợ giọng đọc.');return}
 stopSpeak();reading=true;$('#bRead').textContent='⏸ Đang đọc…';$('#bRead').classList.add('on');
 const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^vi/i.test(x.lang));if(!v)toast('Thiết bị chưa có giọng tiếng Việt; thử bật giọng vi-VN trong cài đặt hệ thống.');
 const ch=(text.replace(/\s+/g,' ').match(/[^.!?;:]+[.!?;:]?/g)||[]).map(s=>s.trim()).filter(Boolean);
 ch.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s);u.lang='vi-VN';if(v)u.voice=v;u.rate=+$('#rate').value;if(i==ch.length-1)u.onend=()=>{if(reading){stopSpeak();done&&done()}};speechSynthesis.speak(u)})}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
/* ===== NỘI DUNG ===== */
const SEC=[
['🌙','Mặt trăng kéo đại dương',
 'Mặt trăng kéo nước biển về phía nó bằng lực hấp dẫn. Nhờ vậy nước biển dâng lên rồi rút xuống mỗi ngày. Đó là thủy triều.',
 'Sự dâng lên và hạ xuống của thủy triều trên khắp các vùng duyên hải là sự nhắc nhở hàng ngày về tác động của Mặt trăng lên hành tinh của chúng ta. Lực hấp dẫn của Mặt trăng hút lên Trái đất là nguyên nhân chính của thủy triều đại dương. Nó làm biến dạng quả cầu đá của hành tinh xanh chỉ vài centimét, nhưng làm các đại dương co giãn từ 1 đến 3 mét. Sự kéo giật liên tục của thủy triều đang làm chậm dần chuyển động quay của Trái đất và làm quỹ đạo rộng hơn. Ngày dài ra khoảng 2 mili giây mỗi thế kỉ, và mỗi năm Mặt trăng lùi ra xa chừng 3,8 xăng-ti-mét.'],
['🌍','Thủy triều và Mặt trăng: hai chỗ nhô',
 'Trái đất giống quả bóng nước hơi bị kéo dài. Nước nhô lên ở phía gần Mặt trăng và cả phía xa Mặt trăng. Trái đất tự quay nên mỗi nơi lần lượt đi qua hai chỗ nhô đó.',
 'Lực hấp dẫn của Mặt trăng làm Trái đất dẹt thành hình hơi oval, vì lực hút mạnh nhất ở phía Trái đất đối diện Mặt trăng và yếu nhất ở phía bên kia. Các đại dương co giãn nhiều hơn quả cầu đá vì chúng ở thể lỏng. Điều này tạo ra chỗ nhô thủy triều ở cả hai phía địa cầu. Chuyển động hằng ngày của Trái đất kéo hai đỉnh thủy triều đi cùng nó, nên chúng quét qua khắp hành tinh và nằm ở phía trước Mặt trăng một chút chứ không thẳng hàng.'],
['📈','Triều dâng và triều rút',
 'Mỗi ngày thường có hai lần nước lên và hai lần nước xuống, cách nhau hơn 12 tiếng. Mỗi nơi lên xuống mạnh yếu khác nhau tùy bờ biển và độ sâu.',
 'Độ cao và tần suất thủy triều thay đổi từ vùng biển này sang vùng biển khác do nhiều yếu tố, chẳng hạn hình dạng đường bờ biển và chiều sâu của nước. Chênh lệch giữa triều cao và triều thấp ở vịnh Fundy, cong và hẹp, thuộc Canada, là gần 16 mét, lớn nhất thế giới. Đa số vùng duyên hải có hai lần triều dâng mỗi ngày, cách nhau 12 giờ 25 phút, nhưng một số nơi chỉ có một lần triều dâng trong 24 giờ 50 phút.'],
['⚡','Nhà máy điện thủy triều',
 'Nước lên xuống làm quay tuabin để tạo ra điện sạch. Nhà máy đầu tiên của thế giới ở nước Pháp, mở năm 1966.',
 'Năng lượng thủy triều có thể khai thác để phát điện. Nhà máy điện thủy triều mở cửa ở Brittany, Pháp, năm 1966, là nhà máy đầu tiên trên thế giới. Một con đập dài 750 mét vắt ngang cửa sông Rance. Nước chảy qua các tuabin khi thủy triều dâng vào và rút ra. Nước chảy làm quay tuabin, phát ra điện.'],
['🦀','Hốc đá do thủy triều',
 'Khi nước rút, cua, ốc, sao biển ở lại các hốc đá đầy nước để khỏi bị khô. Khi nước lên, biển lại phủ kín chúng.',
 'Chu kì thủy triều tạo ra một môi trường sống lưỡng cư ở vùng bờ biển. Lúc triều cao, môi trường đó ngập chìm trong nước. Khi triều rút, nước biến mất và động vật biển lộ ra phải trú ẩn trong các hốc đá. Một số dạng sống tồn tại bên ngoài hốc đá vì chúng đủ bền bỉ để chống chọi với sự khô nước.'],
['☀️','Triều cường và triều cạn',
 'Mặt trời cũng kéo nước biển nhưng yếu hơn Mặt trăng. Trăng mới và trăng tròn: hai lực cùng hướng, nước lên rất cao (triều cường). Trăng bán nguyệt: hai lực làm yếu nhau, nước lên thấp (triều cạn).',
 'Mặt trời cũng ảnh hưởng đến thủy triều đại dương, dù sức hút yếu hơn Mặt trăng. Mức thủy triều cao nhất, gọi là triều cường, xảy ra khi Mặt trời và Mặt trăng hợp lực với nhau lúc trăng mới và trăng tròn. Mức thủy triều thấp nhất, gọi là triều cạn, xảy ra lúc một phần tư mặt trăng đầu và cuối, khi lực hút của Mặt trời phần nào kháng lại lực hút của Mặt trăng.']];
const MID=['Lực hấp dẫn của Mặt trăng hút lên Trái đất là nguyên nhân chính gây ra thủy triều đại dương. Lực này chỉ làm quả cầu đá biến dạng vài centimét, nhưng làm đại dương lên xuống khoảng 1 đến 3 mét. Thủy triều còn làm Trái đất quay chậm dần: ngày dài thêm khoảng 2 mili giây mỗi thế kỉ và Mặt trăng lùi xa khoảng 3,8 cm mỗi năm.',
'Lực hút của Mặt trăng mạnh nhất ở phía gần Mặt trăng và yếu nhất ở phía xa, nên nước biển nhô lên ở hai phía đối diện nhau, khiến Trái đất hơi oval. Trái đất tự quay nên các vùng bờ biển lần lượt đi qua hai chỗ nhô này, nghĩa là mỗi ngày có hai lần nước dâng.',
'Hầu hết vùng ven biển có hai lần triều dâng mỗi ngày, cách nhau 12 giờ 25 phút. Một số nơi chỉ có một lần trong 24 giờ 50 phút. Độ cao thủy triều phụ thuộc hình dạng bờ biển và độ sâu. Vịnh Fundy ở Canada, cong và hẹp, có chênh lệch gần 16 m, lớn nhất thế giới.',
'Nước chảy theo thủy triều làm quay tuabin để phát điện. Nhà máy điện thủy triều đầu tiên thế giới mở năm 1966 ở Brittany, Pháp, với đập dài 750 m chắn ngang cửa sông Rance. Nước chảy qua tuabin cả khi triều dâng vào lẫn khi triều rút ra.',
'Vùng triều là môi trường lúc ngập nước, lúc lộ ra. Khi triều rút, động vật biển phải trú trong các hốc đá còn đọng nước. Một số loài đủ bền bỉ để sống ngoài hốc đá và chịu được khô.',
'Mặt trời cũng gây thủy triều nhưng yếu hơn Mặt trăng. Lúc trăng mới và trăng tròn, Mặt trời, Mặt trăng và Trái đất gần thẳng hàng, hai lực cộng lại gây triều cường (cao nhất). Lúc thượng huyền và hạ huyền, hai lực lệch nhau 90 độ nên yếu đi, gây triều cạn (thấp nhất).'];
const EXT=['Về bản chất đó là lực triều: chênh lệch lực hấp dẫn giữa các điểm trên Trái đất, tỉ lệ nghịch với lập phương khoảng cách. Vì Mặt trăng ở gần nên gây thủy triều mạnh hơn Mặt trời khoảng 2,2 lần. Ma sát triều làm Trái đất mất mô men động lượng quay, còn Mặt trăng nhận thêm nên lùi ra xa.',

{const p=[];for(let i=0;i<700;i++){const u=Math.random()*6.2832,z=Math.random()*2-1,s=Math.sqrt(1-z*z),k=60+Math.random()*30;p.push(k*s*Math.cos(u),k*z,k*s*Math.sin(u))}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));S.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.25})))}

/* vật lý thủy triều (phóng đại) */
const AM=.38,AS=.17,R0=1.7,LEAD=12*Math.PI/180;let phi=0,mAx=new THREE.Vector3(),sAx=new THREE.Vector3(1,0,0),dirty=true;
function hAt(n){const a=n.dot(mAx),b=n.dot(sAx);return AM*(3*a*a-1)/2+AS*(3*b*b-1)/2}
function setPhase(d){phi=((d%360)+360)%360;const r=phi*Math.PI/180;moon.position.set(Math.cos(r)*5.4,0,-Math.sin(r)*5.4);const t=r+LEAD;mAx.set(Math.cos(t),0,-Math.sin(t));dirty=true;
 $('#ph').value=phi|0;$('#phv').textContent=(phi|0)+'°';
 const names=[[0,'Trăng mới'],[45,'Trăng non (lưỡi liềm)'],[90,'Thượng huyền (¼ đầu)'],[135,'Trăng khuyết đầu'],[180,'Trăng tròn'],[225,'Trăng khuyết cuối'],[270,'Hạ huyền (¼ cuối)'],[315,'Trăng tàn']];
 let nm=names.reduce((a,x)=>Math.abs(((phi-x[0]+540)%360)-180)<=22.5?x:a,names[0]);$('#phase').innerHTML='🌙 '+nm[1];
 const c=Math.cos(2*r),sp=$('#spring');if(c>.7){sp.textContent='⬆ Triều cường (Mặt trời + Mặt trăng hợp lực)';sp.style.color='#8ff'}else if(c<-.7){sp.textContent='⬇ Triều cạn (hai lực kháng nhau)';sp.style.color='#ffd37a'}else{sp.textContent='Triều trung gian';sp.style.color='#cde'}}
function deform(){const n=new THREE.Vector3();for(let i=0;i<pos.count;i++){n.set(base[i*3],base[i*3+1],base[i*3+2]);pos.setXYZ(i,n.x*(R0+hAt(n)),n.y*(R0+hAt(n)),n.z*(R0+hAt(n)))}pos.needsUpdate=true;ogeo.computeVertexNormals();dirty=false}
$('#ph').oninput=e=>{auto=false;$('#bOrb').classList.remove('on');setPhase(+e.target.value)};
$$('[data-p]').forEach(b=>b.onclick=()=>{auto=false;$('#bOrb').classList.remove('on');sfx.click();setPhase(+b.dataset.p)});
let auto=false,rot=true;

$('#bRot').onclick=e=>{rot=!rot;e.target.classList.toggle('on',rot);sfx.click()};

/* camera */
let th=.6,ph=.75,rd=17;const tgt=new THREE.Vector3(2.2,0,0);
function camUp(){cam.position.set(tgt.x+rd*Math.sin(ph)*Math.cos(th),tgt.y+rd*Math.cos(ph),tgt.z+rd*Math.sin(ph)*Math.sin(th));cam.lookAt(tgt)}
const ptr=new Map();let pd=0;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);cv.style.cursor='grabbing'};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);pd=0;cv.style.cursor='grab'};
cv.onpointermove=e=>{const p=ptr.get(e.pointerId);if(!p)return;if(ptr.size==1){th-=(e.clientX-p[0])*.008;ph=Math.min(1.5,Math.max(.15,ph-(e.clientY-p[1])*.008))}p[0]=e.clientX;p[1]=e.clientY;if(ptr.size==2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)rd=Math.min(40,Math.max(7,rd*pd/d));pd=d}};
cv.onwheel=e=>{e.preventDefault();rd=Math.min(40,Math.max(7,rd*(1+e.deltaY*.001)))};
function fit(){const r=$('#stage').getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}

const clock=new THREE.Clock(),pdir=new THREE.Vector3(),tmp=new THREE.Vector3();let lastT=-1;
setPhase(0);
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1);

 if(ambOn&&Math.abs(t-lastT)>.05){lastT=t;amb.g.gain.setTargetAtTime(.12+.5*t,AC.currentTime,.2)}

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Chặn phím tắt: F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S
    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();

      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) || 
        (e.ctrlKey && (key === 'u' || key === 's'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 2. Chặn chuột phải (Context Menu)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  });
</script>
