<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trái Đất quanh Mặt Trời – Bốn mùa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#eaf6ff;--card:#fff;--tx:#1b2740;--mut:#5b6b88;--ac:#2a7bff;--bd:#d9e1ef;--ok:#1e9d5a;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a30;--card:#18253f;--tx:#e8eefb;--mut:#9bacc9;--ac:#6ea1ff;--bd:#2a3b5e;--ok:#4cd08a;--bad:#ff7777}}
:root[data-theme="dark"]{--bg:#101a30;--card:#18253f;--tx:#e8eefb;--mut:#9bacc9;--ac:#6ea1ff;--bd:#2a3b5e;--ok:#4cd08a;--bad:#ff7777}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:3fr 1fr;overflow:hidden}
#stage{position:relative;background:radial-gradient(circle at 50% 40%,#3a54c8,#1a2a86 55%,#0c1448);min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:48px;z-index:5;background:rgba(18,30,100,.85);color:#fff;border:1px solid #7fa2ff;border-radius:12px;padding:8px 14px;font-size:13px;line-height:1.5;min-width:230px;max-width:calc(100% - 20px);white-space:normal;overflow:visible}
#hud b{color:#ffd76a}#hud .big{font-size:20px;font-weight:700;color:#fff}
#leg{position:absolute;right:10px;top:48px;z-index:5;background:rgba(18,30,100,.85);color:#dfe8ff;border:1px solid #2d4170;border-radius:12px;padding:6px 10px;font-size:12px}
#leg i{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:middle}
#ftr{position:absolute;left:0;right:0;bottom:0;height:24px;z-index:6;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.3px;color:#dfe8ff;background:rgba(12,20,72,.92);pointer-events:none;user-select:none}#ftr b{color:#ff9f1c}
#ctl{position:absolute;left:0;right:0;bottom:24px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:linear-gradient(transparent,rgba(2,3,10,.9))}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:5px 10px}
button:hover{border-color:var(--ac)}button.on{background:linear-gradient(135deg,#2a7bff,#8a4dff);color:#fff;border-color:transparent}
#ctl button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);font-size:13px;font-weight:600}#ctl button.on{background:linear-gradient(135deg,#ffb02e,#ff5e62);border-color:transparent}#ctl [data-j="3"]{background:#2ecc71;border-color:transparent}#ctl [data-j="0"]{background:#ff9f1c;border-color:transparent}#ctl [data-j="1"]{background:#e8703a;border-color:transparent}#ctl [data-j="2"]{background:#35a7ff;border-color:transparent}
#ctl input[type=range]{width:110px;accent-color:#6ea1ff}
#panel{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--bd);background:var(--bg)}
#top{padding:10px 12px 6px}#top h1{font-size:16px;margin:0 0 6px}
.chips,.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs{padding:0 12px 8px;border-bottom:1px solid var(--bd)}.tabs button{flex:1;padding:6px 4px;font-weight:600}
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px;min-height:0}
.pg{display:none}.pg.on{display:block}
.rd{position:sticky;top:-12px;z-index:2;margin:-12px -12px 10px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px;color:#ff7a1a}.card p{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid var(--bd);padding:4px 6px;text-align:left}th{background:var(--card)}
.fc{cursor:pointer;user-select:none}.fc .a{display:none;color:var(--ok);margin-top:4px}.fc.f .a{display:block}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar div{height:100%;background:var(--ac);width:0;transition:width .3s}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:62vh 1fr}#panel{border-left:0;border-top:1px solid var(--bd)}#leg{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"></div>

    <button id="vSide">Nhìn nghiêng</button><button id="vTop">Nhìn từ trên</button><button id="bFol">🔍 Theo Trái Đất</button>

    <button id="bSnd" class="on">🔊 Âm thanh</button><button id="bAmb">🎵 Nhạc nền</button>
  </div>
</div>
<div id="panel">
  <div id="top"><h1>🌍 Trái Đất &amp; Bốn mùa</h1>
    <div class="chips" id="lv"><button data-l="1" class="on">🧒 Tiểu học</button><button data-l="2">🧑 THCS</button><button data-l="3">🎓 THPT</button></div></div>
  <div class="tabs" id="tabs"><button data-t="d" class="on">📖 Mô tả</button><button data-t="r">📝 Ôn tập</button><button data-t="q">🎮 Trò chơi</button></div>
  <div id="scroll">
    <div class="pg on" id="pd"></div>
    <div class="pg" id="pr"></div>
    <div class="pg" id="pq"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let level=1,sndOn=true;
/* ---------- ÂM THANH ---------- */
let AC=null,amb=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d=.15,t='sine',v=.12,delay=0,slide=0){if(!sndOn)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.02)}
const sfx={click:()=>beep(660,.08,'triangle'),ok:()=>{beep(523,.14,'sine',.15);beep(659,.14,'sine',.15,.12);beep(784,.25,'sine',.15,.24)},bad:()=>{beep(180,.35,'sawtooth',.1,0,.6)},whoosh:()=>beep(200,.6,'sine',.08,0,4),win:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.22,'triangle',.14,i*.12)),season:()=>{beep(880,.2,'sine',.1);beep(1175,.3,'sine',.08,.12)}};
function toggleAmb(){const c=ac();if(!c)return;if(amb){amb.forEach(n=>n.stop());amb=null;return false}
 const g=c.createGain();g.gain.value=.05;g.connect(c.destination);const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.15;lg.gain.value=.03;l.connect(lg).connect(g.gain);amb=[l];
 [110,165,220.5].forEach(f=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start();amb.push(o)});l.start();return true}
/* ---------- ĐỌC NỘI DUNG ---------- */
let speaking=null;
function stopSpeak(){speechSynthesis.cancel();if(speaking){speaking.textContent='🔊 Đọc nội dung';speaking=null}}
function speak(text,btn){if(!('speechSynthesis' in window)){alert('Trình duyệt chưa hỗ trợ đọc.');return}
 if(speaking===btn){stopSpeak();return}stopSpeak();const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.95;
 const v=speechSynthesis.getVoices().find(v=>/vi/i.test(v.lang));if(v)u.voice=v;
 btn.textContent='⏹ Dừng đọc';speaking=btn;u.onend=u.onerror=()=>{if(speaking===btn){btn.textContent='🔊 Đọc nội dung';speaking=null}};speechSynthesis.speak(u)}
/* ---------- NỘI DUNG ---------- */
const DESC_OLD={
1:[["Trái Đất đi vòng quanh Mặt Trời","Trái Đất vừa tự quay quanh mình, vừa đi một vòng quanh Mặt Trời. Đi hết một vòng mất một năm, khoảng 365 ngày."],
["Trái Đất bị nghiêng","Trái Đất giống một quả bóng có cái cọc xiên xuyên qua. Cái cọc ấy luôn nghiêng về cùng một phía, dù Trái Đất đi tới đâu."],
["Vì sao có bốn mùa?","Khi Bắc bán cầu nghiêng về phía Mặt Trời thì nhận nhiều nắng, trời nóng, ngày dài: đó là mùa hè. Khi nghiêng ra xa thì trời lạnh, ngày ngắn: đó là mùa đông. Hai mùa ở giữa là xuân và thu."],
["Bắc và Nam ngược nhau","Khi miền Bắc của Trái Đất đang mùa hè thì miền Nam đang mùa đông, và ngược lại."]],
2:[["Chuyển động tịnh tiến","Trái Đất chuyển động quanh Mặt Trời theo quỹ đạo hình elip gần tròn, chu kì khoảng 365 ngày 6 giờ, hướng ngược chiều kim đồng hồ khi nhìn từ phía Bắc."],
["Trục nghiêng không đổi","Trục Trái Đất nghiêng 66°33' so với mặt phẳng quỹ đạo, và luôn giữ nguyên hướng nghiêng trong suốt năm. Vì vậy, mỗi nửa cầu lần lượt hướng về Mặt Trời."],
["Bốn ngày đặc biệt","21/3: xuân phân. 22/6: hạ chí. 23/9: thu phân. 22/12: đông chí. Vào hạ chí, tia nắng vuông góc với chí tuyến Bắc; vào đông chí, vuông góc với chí tuyến Nam; vào hai ngày phân, vuông góc với xích đạo."],
["Hệ quả","Góc chiếu của tia nắng và thời gian chiếu sáng thay đổi nên có các mùa, và ngày đêm dài ngắn khác nhau theo mùa. Hai bán cầu có mùa trái ngược nhau."]],
3:[["Cơ chế hình thành mùa","Do trục Trái Đất nghiêng một góc không đổi 23°27' so với pháp tuyến mặt phẳng hoàng đạo và chuyển động tịnh tiến, vĩ độ có tia sáng vuông góc (xích vĩ Mặt Trời) dao động giữa 23°27'B và 23°27'N."],
["Phân bố nhiệt – ánh sáng","Góc nhập xạ lớn và thời gian chiếu sáng dài làm bán cầu hấp thụ nhiều bức xạ hơn. Chênh lệch ngày đêm tăng theo vĩ độ; từ vòng cực (66°33') về cực xuất hiện ngày hoặc đêm dài 24 giờ, tại cực kéo dài 6 tháng."],
["Mùa thiên văn và mùa khí hậu","Mùa thiên văn bắt đầu từ các ngày phân, chí. Theo lịch cổ truyền châu Á, lập xuân, lập hạ, lập thu, lập đông đánh dấu mốc mùa sớm hơn khoảng 1,5 tháng, vì nhiệt đạt cực đại chậm sau thời điểm bức xạ cực đại."],
["Lưu ý","Mùa không do khoảng cách tới Mặt Trời quyết định: Trái Đất gần Mặt Trời nhất (cận nhật) vào đầu tháng 1, lúc Bắc bán cầu đang mùa đông. Ở vùng nhiệt đới, mùa thể hiện rõ hơn qua lượng mưa."]]};
const FC=[["Trái Đất đi một vòng quanh Mặt Trời mất bao lâu?","Khoảng 365 ngày 6 giờ (1 năm)."],["Trục Trái Đất nghiêng bao nhiêu?","66°33' so với mặt phẳng quỹ đạo (lệch 23°27' so với phương thẳng đứng)."],["Hạ chí là ngày nào ở Bắc bán cầu?","22/6, ngày dài nhất, đêm ngắn nhất."],["Đông chí là ngày nào ở Bắc bán cầu?","22/12, ngày ngắn nhất, đêm dài nhất."],["Hai ngày ngày và đêm dài bằng nhau?","21/3 (xuân phân) và 23/9 (thu phân)."],["Vì sao có mùa?","Trục nghiêng không đổi + Trái Đất quay quanh Mặt Trời."]];
const BANK=[
{l:1,q:"Trái Đất đi một vòng quanh Mặt Trời mất bao lâu?",o:["1 ngày","1 tháng","1 năm","1 tuần"],a:2,e:"Một vòng quanh Mặt Trời là một năm, khoảng 365 ngày."},
{l:1,q:"Khi Bắc bán cầu nghiêng về phía Mặt Trời thì ở đó là mùa gì?",o:["Mùa hè","Mùa đông","Mùa thu","Mùa xuân"],a:0,e:"Nhận nhiều nắng hơn nên nóng, ngày dài: mùa hè."},
{l:1,q:"Một năm có mấy mùa?",o:["2","3","4","5"],a:2,e:"Xuân, hạ, thu, đông."},
{l:1,q:"Khi miền Bắc Trái Đất đang mùa hè thì miền Nam đang mùa gì?",o:["Mùa hè","Mùa đông","Mùa xuân","Không có mùa"],a:1,e:"Hai bán cầu có mùa ngược nhau."},
{l:2,q:"Ngày 22/6 gọi là gì?",o:["Xuân phân","Hạ chí","Thu phân","Đông chí"],a:1,e:"22/6 là hạ chí ở Bắc bán cầu."},
{l:2,q:"Ngày 23/9, tia nắng Mặt Trời vuông góc với mặt đất ở đâu?",o:["Chí tuyến Bắc","Chí tuyến Nam","Xích đạo","Cực Bắc"],a:2,e:"Hai ngày phân (21/3, 23/9) Mặt Trời ở thiên đỉnh tại xích đạo."},
{l:2,q:"Trục Trái Đất trong khi chuyển động quanh Mặt Trời có đặc điểm gì?",o:["Luôn hướng về Mặt Trời","Giữ nguyên hướng nghiêng","Đổi hướng mỗi tháng","Thẳng đứng"],a:1,e:"Hướng trục không đổi nên mỗi nửa cầu lần lượt ngả về Mặt Trời."},
{l:2,q:"Ngày 22/12 ở Bắc bán cầu có đặc điểm nào?",o:["Ngày dài nhất","Ngày đêm bằng nhau","Ngày ngắn nhất, đêm dài nhất","Không có đêm"],a:2,e:"Đông chí: Bắc bán cầu ngả xa Mặt Trời."},
{l:3,q:"Xích vĩ Mặt Trời dao động trong khoảng nào?",o:["0° – 23°27'","23°27'B – 23°27'N","66°33'B – 66°33'N","90°B – 90°N"],a:1,e:"Giữa hai chí tuyến Bắc và Nam."},
{l:3,q:"Nguyên nhân chủ yếu hình thành các mùa là gì?",o:["Khoảng cách tới Mặt Trời thay đổi","Trục nghiêng không đổi và chuyển động tịnh tiến","Tự quay quanh trục","Hoạt động của Mặt Trời"],a:1,e:"Khoảng cách chỉ thay đổi nhỏ; cận nhật vào tháng 1."},
{l:3,q:"Tại cực vào các ngày chí, hiện tượng nào xảy ra?",o:["Ngày đêm 12 giờ","Ngày hoặc đêm kéo dài 24 giờ trở lên","Mặt Trời mọc đúng Đông","Không đổi"],a:1,e:"Từ vòng cực về cực có ngày hoặc đêm dài 24 giờ; tại cực kéo dài 6 tháng."},

const ray=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0xff4040}));scene.add(ray);
let theta=0,playing=true,spinOn=true,goal=null,speed=25,lastSeason=-1;
const cs={r:17,p:1.15,t:.5},ct={r:17,p:1.15,t:.5};const tg=new THREE.Vector3();let follow=false;
function setCam(){cam.position.set(tg.x+cs.r*Math.sin(cs.p)*Math.sin(cs.t),tg.y+cs.r*Math.cos(cs.p),tg.z+cs.r*Math.sin(cs.p)*Math.cos(cs.t));cam.lookAt(tg)}
let drag=null;
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';ac()};
cv.onpointermove=e=>{if(!drag)return;ct.t-=(e.clientX-drag[0])*.007;ct.p=Math.min(3,Math.max(.1,ct.p-(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY]};
cv.onpointerup=()=>{drag=null;cv.style.cursor='grab'};
cv.onwheel=e=>{e.preventDefault();ct.r=Math.min(40,Math.max(2.5,ct.r+e.deltaY*.02))};
function resize(){const s=$('#stage');renderer.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('#stage'));resize();
const DS=[173,266,356,445,538];
function dateOf(t){let u=((t%6.2832)+6.2832)%6.2832,i=Math.floor(u/(Math.PI/2)),f=u/(Math.PI/2)-i,d=Math.round(DS[i]+f*(DS[i+1]-DS[i]));const D=new Date(2026,0,d);return D.getDate()+'/'+(D.getMonth()+1)}
const SN=['Mùa hạ','Mùa thu','Mùa đông','Mùa xuân'],ICON=['☀️','🍂','❄️','🌱'];
function hud(){const u=((theta%6.2832)+6.2832)%6.2832,k=Math.floor(u/(Math.PI/2)),nk=k,sk=(k+2)%4,dec=Math.asin(Math.sin(TILT)*Math.cos(u))*180/Math.PI,ad=Math.abs(dec);
 const dl=ad<1?'Ngày ≈ đêm (12 giờ)':(dec>0?'Ngày dài hơn đêm':'Ngày ngắn hơn đêm');const dec2=Math.floor(ad)+'°'+Math.round((ad%1)*60)+"'"+(ad<.5?'':dec>0?'B':'N');
 $('#hud').innerHTML=`<div class="big">📅 ${dateOf(theta)}</div>Bắc bán cầu: <b>${ICON[nk]} ${SN[nk]}</b><br>Nam bán cầu: <b>${ICON[sk]} ${SN[sk]}</b><br>Nắng vuông góc tại vĩ độ: <b>${dec2}</b><br>Bắc bán cầu: ${dl}`;
 if(k!==lastSeason){if(lastSeason>=0&&playing)sfx.season();lastSeason=k}}
let prev=performance.now(),hc=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;
 if(goal!==null){let d=goal-theta;d=((d+3.1416)%6.2832+6.2832)%6.2832-3.1416;theta+=d*Math.min(1,dt*3);if(Math.abs(d)<.004){theta=goal;goal=null}}
 else if(playing)theta+=dt*speed*Math.PI/180;
 orb.position.set(R*Math.cos(theta),0,-R*Math.sin(theta));if(spinOn)spin.rotation.y+=dt*(playing?3+speed*.05:1.5);
 ray.geometry.setFromPoints([orb.position.clone().multiplyScalar(.2),orb.position]);
 tg.lerp(follow?orb.position:new THREE.Vector3(),Math.min(1,dt*4));for(const k of['r','p','t'])cs[k]+=(ct[k]-cs[k])*Math.min(1,dt*5);setCam();
 if((hc+=dt)>.1){hc=0;hud()}renderer.render(scene,cam)}
requestAnimationFrame(loop);
/* ---------- ĐIỀU KHIỂN ---------- */
$('#bPlay').onclick=e=>{playing=!playing;goal=null;e.target.textContent=playing?'⏸ Dừng':'▶ Chạy';e.target.classList.toggle('on',playing);sfx.click()};
$('#spd').oninput=e=>speed=+e.target.value;
$$('[data-j]').forEach(b=>b.onclick=()=>{goal=+b.dataset.j*Math.PI/2;if(+b.dataset.j===3)goal=-Math.PI/2;playing=false;$('#bPlay').textContent='▶ Chạy';$('#bPlay').classList.remove('on');sfx.whoosh()});
$('#vSide').onclick=()=>{Object.assign(ct,{r:17,p:1.4});sfx.click()};$('#vTop').onclick=()=>{Object.assign(ct,{r:16,p:.15});sfx.click()};
$('#bLines').onclick=e=>{lines.visible=!lines.visible;e.target.classList.toggle('on',lines.visible);sfx.click()};
$('#bSpin').onclick=e=>{spinOn=!spinOn;e.target.classList.toggle('on',spinOn);sfx.click()};
$('#bSnd').onclick=e=>{sndOn=!sndOn;e.target.classList.toggle('on',sndOn);e.target.textContent=sndOn?'🔊 Âm thanh':'🔇 Âm thanh';if(sndOn)sfx.click()};
$('#bAmb').onclick=e=>{const r=toggleAmb();e.target.classList.toggle('on',!!r)};
$('#bFol').onclick=e=>{follow=!follow;e.target.classList.toggle('on',follow);ct.r=follow?5:17;sfx.click()};
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Chặn phím tắt: F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S
    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();

      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) || 
        (e.ctrlKey && (key === 'u' || key === 's'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 2. Chặn chuột phải (Context Menu)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  });
</script>
