<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Các đới khí hậu trên Trái Đất – Mô hình 3D</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--tx:#1b2a3a;--mut:#5b6b7c;--line:#d5dee8;--pri:#1f7ae0;--ok:#2e9e5b;--bad:#d9453b;--card:#eef3f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--panel:#141d2e;--tx:#e8eef7;--mut:#9fb0c4;--line:#27344a;--pri:#5aa2ff;--card:#1a2639;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--panel:#141d2e;--tx:#e8eef7;--mut:#9fb0c4;--line:#27344a;--pri:#5aa2ff;--card:#1a2639;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:row}
#stage{flex:3;position:relative;background:radial-gradient(circle at 50% 40%,#16284a,#050912);min-width:0;overflow:hidden}
#c{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:0;right:0;bottom:24px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#hud button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer}
#hud button{background:rgba(20,29,46,.85);color:#fff;border-color:#3a4c6a}
#hud button:hover,.btn:hover{border-color:var(--pri)}
#title{position:absolute;top:10px;left:12px;color:#fff;font-weight:700;font-size:clamp(14px,2vw,20px);text-shadow:0 1px 4px #000}
#tip{position:absolute;top:44px;left:12px;right:12px;color:#cfe0ff;font-size:13px;text-shadow:0 1px 3px #000}
aside{flex:1;min-width:300px;max-width:460px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri)}
.pane{display:none;flex:1;overflow-y:auto;padding:14px;min-height:0;line-height:1.55;font-size:15px}
.pane.on{display:block}
h2{font-size:18px;margin:4px 0 8px}h3{font-size:16px;margin:12px 0 6px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.zbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.z{flex:1;padding:9px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;font-size:14px}
.z.on{border-color:var(--pri)}
.hab{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.hab .e{font-size:28px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(46,158,91,.18)}.opt.bad{border-color:var(--bad);background:rgba(217,69,59,.18)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid var(--line);padding:6px;text-align:left}
#search{position:absolute;top:8px;right:10px;display:flex;gap:4px;z-index:2}
#search input{width:min(230px,45vw);padding:7px 10px;border-radius:999px;border:1px solid #3a4c6a;background:rgba(20,29,46,.9);color:#fff;font-size:14px}
#search button{border:1px solid #3a4c6a;background:rgba(20,29,46,.9);color:#fff;border-radius:999px;padding:6px 11px;cursor:pointer}
#res{position:absolute;top:46px;right:10px;max-width:min(320px,70%);background:rgba(10,20,40,.88);color:#fff;border:1px solid #ffd54a;border-radius:12px;padding:8px 12px;font-size:14px;display:none;z-index:2}
#tip{right:auto;max-width:48%}
#foot{position:absolute;left:0;right:0;bottom:0;text-align:center;padding:4px 0;font-size:12px;letter-spacing:.3px;color:#cfd8e6;background:rgba(5,9,18,.65);z-index:3;pointer-events:none}
#foot b{color:#ff8a1f}
#lvl{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
#lvl button{flex:1;padding:6px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font-size:13px}
#lvl button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (max-width:760px){#title{max-width:40%;font-size:13px}}
@media (max-width:760px){#app{flex-direction:column}#stage{flex:3}aside{flex:2;max-width:none;min-width:0;border-left:0;border-top:1px solid var(--line)}#tip{display:none}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="c"></canvas>
  <div id="title">🌍 Các đới khí hậu trên Trái Đất</div>
  <div id="search"><input id="q" list="cl" placeholder="Nhập quốc gia hoặc vĩ độ, kinh độ" autocomplete="off"><button id="go">🔍</button><datalist id="cl"></datalist></div><div id="res"></div><div id="tip">Kéo để xoay • Cuộn chuột hoặc chụm hai ngón để phóng to, thu nhỏ • Chạm vào quả địa cầu để biết quốc gia • Chạm vào biểu tượng 🐧🌴🐻‍❄️ để xem sinh cảnh</div>

   <button data-f="hb">❄️ Hàn đới Bắc</button><button data-f="on">🌳 Ôn đới</button><button data-f="tn">🌴 Nhiệt đới</button><button data-f="hn">🐧 Hàn đới Nam</button>
   <button id="zi">➕ Phóng to</button><button id="zo">➖ Thu nhỏ</button><button id="rot">⏸ Tự quay</button><button id="amb">🔈 Âm thanh nền</button>
  </div>
 </div>
 <aside>
  <div id="lvl"><span>Mức học:</span><button data-l="th">🧒 Tiểu học</button><button data-l="cs" class="on">🎒 THCS</button><button data-l="pt">🎓 THPT</button></div>
  <nav><button class="on" data-t="desc">📖 Mô tả</button><button data-t="rev">📝 Ôn tập</button><button data-t="game">🎮 Trò chơi</button></nav>
  <div class="pane on" id="desc"></div>
  <div class="pane" id="rev"></div>
  <div class="pane" id="game"></div>
 </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Dữ liệu ===== */
const Z={
 tn:{n:"Nhiệt đới (đới nóng)",c:"#f0883a",r:"Từ 23°27′B đến 23°27′N (giữa hai chí tuyến)",
  d:"Quanh năm nhận nhiều ánh sáng và nhiệt, góc chiếu của tia Mặt Trời lớn. Nóng quanh năm, lượng mưa nhiều (nhất là gần Xích đạo). Đây là đới có nhiều loài sinh vật nhất Trái Đất. Việt Nam nằm trong đới này.",
  h:[{e:"🌴",n:"Rừng mưa nhiệt đới",t:"Rừng rậm nhiều tầng, mưa nhiều quanh năm. Có đười ươi, vẹt, báo, ếch cây, hàng triệu loài côn trùng.",lat:3,lon:-62},
     {e:"🦁",n:"Xavan",t:"Đồng cỏ cao với cây thưa, có mùa khô và mùa mưa. Sống ở đây có sư tử, hươu cao cổ, voi, ngựa vằn.",lat:-2,lon:35},

 on:{n:"Ôn đới (đới ôn hòa)",c:"#5cb85c",r:"Từ chí tuyến đến vòng cực (23°27′ – 66°33′ ở mỗi bán cầu)",
  d:"Khí hậu mát mẻ, có bốn mùa rõ rệt: xuân, hạ, thu, đông. Lượng nhiệt và mưa vừa phải. Phần lớn dân cư thế giới sống ở đới này vì thuận lợi cho trồng trọt và chăn nuôi.",
  h:[{e:"🍁",n:"Rừng lá rộng",t:"Cây thay lá theo mùa (mùa thu lá vàng, đỏ, mùa đông trụi lá). Có hươu, sóc, gấu nâu, cáo.",lat:45,lon:-75},
     {e:"🌲",n:"Rừng lá kim (taiga)",t:"Cây thông, tuyết tùng lá hình kim chịu được lạnh. Có nai sừng tấm, sói, gấu nâu.",lat:58,lon:90},
     {e:"🌾",n:"Thảo nguyên",t:"Đồng cỏ rộng, ít cây, mưa vừa. Có bò rừng bizon, ngựa hoang, chuột đồng.",lat:-36,lon:-62}]},
 hd:{n:"Hàn đới (đới lạnh)",c:"#8fd0ff",r:"Từ vòng cực (66°33′) đến cực Bắc và cực Nam",
  d:"Rất lạnh quanh năm, băng tuyết phủ gần như quanh năm. Tia Mặt Trời chiếu rất xiên, có ngày và đêm kéo dài nhiều tháng. Ít người sinh sống, thực vật nghèo nàn.",
  h:[{e:"🐻‍❄️",n:"Bắc Cực: băng và đồng rêu",t:"Có gấu Bắc Cực, hải cẩu, cáo tuyết, tuần lộc. Mùa hạ ngắn, rêu và địa y mọc trên đất đóng băng.",lat:78,lon:-40},
     {e:"🐧",n:"Nam Cực: lục địa băng",t:"Lạnh nhất thế giới. Chim cánh cụt, hải cẩu, cá voi sống ở ven biển. Gần như không có thực vật.",lat:-76,lon:20}]}
};
const Q=[
 ["Đới nóng (nhiệt đới) nằm ở đâu?",["Giữa hai chí tuyến","Giữa hai vòng cực","Quanh hai cực","Chỉ ở Xích đạo"],0,"Đới nóng nằm giữa chí tuyến Bắc và chí tuyến Nam."],
 ["Vĩ độ của chí tuyến là bao nhiêu?",["66°33′","23°27′","0°","90°"],1,"Chí tuyến ở vĩ độ 23°27′ Bắc và Nam."],
 ["Vòng cực nằm ở vĩ độ nào?",["23°27′","45°","66°33′","0°"],2,"Vòng cực Bắc và Nam ở vĩ độ 66°33′."],
 ["Mấy đới khí hậu theo vĩ độ trên Trái Đất?",["3","5","7","2"],1,"Có 5 đới: 1 nhiệt đới, 2 ôn đới, 2 hàn đới."],
 ["Đới nào có bốn mùa rõ rệt?",["Nhiệt đới","Ôn đới","Hàn đới","Không đới nào"],1,"Ôn đới có xuân, hạ, thu, đông."],
 ["Gấu Bắc Cực sống ở đới nào?",["Nhiệt đới","Ôn đới","Hàn đới","Hoang mạc"],2,"Gấu Bắc Cực sống ở vùng băng tuyết hàn đới."],
 ["Động vật nào đặc trưng cho xavan?",["Chim cánh cụt","Hươu cao cổ","Gấu trắng","Tuần lộc"],1,"Xavan ở nhiệt đới có hươu cao cổ, sư tử, voi."],
 ["Rừng mưa nhiệt đới có đặc điểm gì?",["Lạnh, khô","Mưa nhiều, nóng quanh năm","Có tuyết","Cây lá kim"],1,"Rừng mưa nhiệt đới nóng ẩm, rừng rậm nhiều tầng."],
 ["Nơi nào lạnh nhất thế giới?",["Sahara","Amazon","Nam Cực","Xavan châu Phi"],2,"Nam Cực là lục địa băng, lạnh nhất Trái Đất."],
 ["Việt Nam nằm trong đới khí hậu nào?",["Hàn đới","Ôn đới","Nhiệt đới","Cận cực"],2,"Việt Nam nằm trong đới nóng (nhiệt đới)."]
];
const REV=`<h2>Ghi nhớ nhanh</h2>
<div class="card"><b>5 đới khí hậu:</b> 1 đới nóng (nhiệt đới), 2 đới ôn hòa (ôn đới), 2 đới lạnh (hàn đới).</div>
<table><tr><th>Đới</th><th>Vĩ độ</th><th>Đặc điểm</th></tr>
<tr><td>🌴 Nhiệt đới</td><td>0° – 23°27′</td><td>Nóng quanh năm, mưa nhiều</td></tr>
<tr><td>🍁 Ôn đới</td><td>23°27′ – 66°33′</td><td>Bốn mùa rõ rệt</td></tr>
<tr><td>🐧 Hàn đới</td><td>66°33′ – 90°</td><td>Lạnh giá, băng tuyết</td></tr></table>
<h3>Các đường quan trọng</h3>
<div class="card">Xích đạo: 0°. Chí tuyến Bắc và Nam: 23°27′. Vòng cực Bắc và Nam: 66°33′.</div>
<h3>Vì sao có các đới?</h3>
<div class="card">Trái Đất hình cầu nên tia Mặt Trời chiếu vào mỗi vĩ độ với góc khác nhau. Gần Xích đạo tia chiếu gần thẳng đứng nên nóng. Gần hai cực tia chiếu rất xiên nên lạnh.</div>
<h3>Sinh cảnh tiêu biểu</h3>
<div class="card">🌴 Nhiệt đới: rừng mưa, xavan, hoang mạc nóng.<br>🍁 Ôn đới: rừng lá rộng, rừng lá kim, thảo nguyên.<br>🐧 Hàn đới: đồng rêu, băng tuyết.</div>
<h3>Mẹo nhớ</h3>
<div class="card">Chí tuyến 23, vòng cực 66. Hai con số này cộng lại bằng 90 độ (23°27′ + 66°33′ = 90°).</div>
<h3>Câu hỏi suy nghĩ</h3>
<div class="card">Vì sao nhiều nước ôn đới có người ở đông hơn hàn đới? Hãy thử giải thích theo nhiệt độ và mùa trồng trọt.</div>`;

/* ===== Âm thanh ===== */
let AC=null;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,d=.12,type="sine",v=.12,delay=0,f2){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(fq,type,d,v){try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type=type;fl.frequency.value=fq;const t=a.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d/2);g.gain.linearRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start()}catch(e){}}
const sClick=()=>tone(660,.08,"triangle",.1),sGood=()=>[523,659,784].forEach((f,i)=>tone(f,.18,"triangle",.14,i*.09)),sBad=()=>tone(200,.3,"sawtooth",.08,0,110),sSwap=()=>tone(300,.25,"sine",.1,0,900);
let ambOn=false,curZone=null;
setInterval(()=>{if(!ambOn)return;
 if(curZone==="tn"){tone(2200,.1,"sine",.05,0,3200);tone(2600,.1,"sine",.05,.15,3400);noise(3000,"bandpass",.6,.015)}
 else if(curZone==="on"){noise(700,"bandpass",1,.05);tone(1800,.08,"sine",.03,.3,2300)}
 else if(curZone==="hd"){noise(350,"lowpass",1.4,.09);tone(420,.9,"sine",.02,0,380)}
 else noise(500,"bandpass",.8,.03)},1300);

/* ===== Đọc nội dung ===== */
let reading=false;
function say(t){speechSynthesis.cancel();if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang="vi-VN";u.rate=.95;u.onend=u.onerror=()=>{reading=false;document.querySelectorAll(".rd").forEach(b=>b.textContent="🔊 Đọc nội dung")};reading=true;speechSynthesis.speak(u)}
function rdBtn(getText){const b=document.createElement("button");b.className="btn rd";b.textContent="🔊 Đọc nội dung";b.onclick=()=>{sClick();if(reading){speechSynthesis.cancel();reading=false;b.textContent="🔊 Đọc nội dung"}else{say(getText());b.textContent="⏹ Dừng đọc"}};return b}

/* ===== Giao diện các tab ===== */
const $=s=>document.querySelector(s);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{sClick();speechSynthesis.cancel();reading=false;document.querySelectorAll("nav button,.pane").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.t).classList.add("on")});

let lastZ=null;function showZone(k,hi){lastZ=k;
 const p=$("#desc");p.innerHTML="";
 p.appendChild(rdBtn(()=>p.querySelector(".txt").innerText));
 const bt=document.createElement("div");bt.className="zbtns";
 [["tn","🌴 Nhiệt đới"],["on","🍁 Ôn đới"],["hd","🐧 Hàn đới"]].forEach(([id,l])=>{const b=document.createElement("button");b.className="z"+(id===k?" on":"");b.textContent=l;b.onclick=()=>{sSwap();focusZone(id==="hd"?"hb":id)};bt.appendChild(b)});
 p.appendChild(bt);
 const t=document.createElement("div");t.className="txt";
 if(!k){t.innerHTML=`<h2>Các đới khí hậu theo vĩ độ</h2><p>Trái Đất hình cầu nên mỗi nơi nhận được lượng ánh sáng và nhiệt khác nhau. Dựa vào vĩ độ, các nhà khoa học chia bề mặt Trái Đất thành 5 đới khí hậu: một đới nóng, hai đới ôn hòa và hai đới lạnh.</p><div class="card">Mô hình 3D: vùng <b>màu cam</b> là nhiệt đới, <b>màu xanh lá</b> là ôn đới, <b>màu xanh nhạt</b> là hàn đới. Đường đỏ là hai chí tuyến.</div><p>Hãy bấm một đới ở trên hoặc dưới mô hình, hoặc chạm vào các biểu tượng sinh vật trên quả địa cầu để khám phá. Bạn cũng có thể gõ tên quốc gia (hoặc vĩ độ, kinh độ) vào ô tìm kiếm phía trên mô hình, hoặc chạm vào một điểm bất kỳ trên quả địa cầu để biết đó là nước nào.</p>`}
 else{const z=Z[k];t.innerHTML=`<h2>${z.n}</h2><div class="card"><b>Vị trí:</b> ${z.r}</div><p>${(DL[k]&&DL[k][lv])||z.d}</p><div class="card">💡 ${DX[k][lv]}</div><h3>Sinh cảnh ở ${z.n.split(" (")[0].toLowerCase()}</h3>`+z.h.map((h,i)=>`<div class="card hab ${hi===i?"sel":""}" data-i="${i}"><span class="e">${h.e}</span><div><b>${h.n}</b><br>${h.t}</div></div>`).join("")+`<p style="color:var(--mut);font-size:13px">Chạm vào một sinh cảnh để xoay quả địa cầu tới đó.</p>`}
 p.appendChild(t);
 if(!k)t.insertAdjacentHTML("afterbegin",`<div class="card">🎓 ${DX.all[lv]}</div>`);t.querySelectorAll(".hab").forEach(el=>el.onclick=()=>{const h=Z[k].h[+el.dataset.i];sClick();faceTo(h.lat,h.lon)});

const ang=(a,b,c,d)=>{const r=Math.PI/180;return Math.acos(Math.max(-1,Math.min(1,Math.sin(a*r)*Math.sin(c*r)+Math.cos(a*r)*Math.cos(c*r)*Math.cos((b-d)*r))))/r};

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Chặn phím tắt: F12, Ctrl+U, Ctrl+Shift+I/J/C, Ctrl+S
    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();

      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) || 
        (e.ctrlKey && (key === 'u' || key === 's'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 2. Chặn chuột phải (Context Menu)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  });
</script>
